<!--
  柏捷工地App「iPhone 網頁版」（使用者 2026-11-08：iPhone 不能裝 App，用網頁＋Safari「加入主畫面」）。
  2026-11-10 改版（使用者：「iphone版的線上網址他沒有做更新，依樣是舊版的」）：跟 Android App 0.9.36 用代碼登入的畫面一樣——
    首頁：問候＋所在地天氣、我的工地（進入）、今日提醒／待辦、這週行程、最新消息（＋注意事項）、這週天氣。
    施工人員：進入 → 我的工作（傳工作、照片、單據照片）＋看施工日誌。
    老闆、主任、公司：進入 → 工地頁（施工日誌、鋼筋施工單、混凝土灌漿數量、發包、待辦事項、3D 結構＝3d.html）；行事曆可以看、新增、修改。
  iPhone 網頁做不到的：桌面小工具、App 關著時的通知。
  放在自己的網址（不是嵌在 Google 頁面裡），iPhone 才記得住代碼；資料直接傳給收件服務（跟 App 同一套）。
  代碼：第一次輸入、登入成功後記在這支手機，之後鎖住不能改，只按「登入」。
  同一支手機打錯 3 次鎖 30 分鐘，之後再錯就一直鎖，要管理者在「人員管理」解除（收件服務第 5 版記錄）。
  這個檔案公開沒關係：裡面沒有任何代碼或密碼。
-->
<style>
:root { --teal:#16A6A0; --blue:#2F80ED; --navy:#1C5D99; --orange:#F2994A; --bg:#F1F7F8; --ink:#183B56; --muted:#5D7486; --line:#C6D3DC;
  --green:#1E9E6A; --todo:#1E8E5A; --red:#E5383B; --warn:#E0662B; --tealsoft:#D9F2F0; --bluesoft:#DCEBFB; --purple:#7A4BB0; --soft:#F1F5F7;
  --grad:linear-gradient(120deg, #16A6A0, #2F80ED); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size:17px; -webkit-text-size-adjust:100%; }
button { font-family:inherit; cursor:pointer; color:inherit; }
.top { background:var(--grad); color:#fff; padding:10px 6px; padding-top:calc(10px + env(safe-area-inset-top)); display:flex; align-items:center; gap:2px; position:sticky; top:0; z-index:5; min-height:54px; }
.top h1 { font-size:19px; margin:0 0 0 6px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top button { background:none; border:0; color:#fff; font-size:15px; padding:6px 10px; font-weight:bold; white-space:nowrap; }
.top .back { font-size:30px; line-height:1; padding:0 10px 3px; font-weight:normal; }
.wrap { max-width:680px; margin:0 auto; padding:12px 12px 48px; }
.card { background:#fff; border-radius:16px; padding:13px 14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(24,59,86,.10); }
.ttl { font-size:17px; font-weight:800; }
.row { display:flex; align-items:center; gap:8px; }
.grow { flex:1; min-width:0; }
.label { font-size:13.5px; color:var(--muted); margin:2px 0 6px; font-weight:bold; }
.sub { font-size:13px; color:var(--muted); }
.note { font-size:13px; color:var(--muted); line-height:1.5; }
.chips { display:flex; flex-wrap:wrap; gap:7px; }
.chips.scroll { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; scrollbar-width:none; }
.chips.scroll::-webkit-scrollbar { display:none; }
.chip { border:1.5px solid var(--line); background:#fff; border-radius:18px; padding:7px 14px; font-size:16px; white-space:nowrap; flex:none; }
.chip.on { background:var(--teal); border-color:var(--teal); color:#fff; font-weight:bold; }
.chip.small { padding:5px 11px; font-size:14.5px; }
.chip.add { background:var(--todo); border-color:var(--todo); color:#fff; font-weight:bold; }
.big { display:block; width:100%; border:0; border-radius:14px; background:var(--grad); color:#fff; font-size:18px; font-weight:bold; padding:14px; margin:4px 0 10px; }
.big:disabled { background:#cbd5dc; }
.ghost { display:block; width:100%; border:2px solid var(--navy); background:#fff; color:var(--navy); border-radius:12px; font-size:16.5px; font-weight:bold; padding:11px; margin-bottom:10px; }
.ghost.red { border-color:var(--red); color:var(--red); }
.ghost.dim { border-color:var(--line); color:var(--muted); font-weight:normal; }
.pill { border:0; border-radius:14px; background:var(--grad); color:#fff; font-size:13.5px; font-weight:bold; padding:5px 11px; white-space:nowrap; margin-left:6px; }
.pill:disabled { opacity:.45; }
input[type=text], input[type=date], input[type=time], textarea { width:100%; font-size:17px; padding:10px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; background:#fff; color:var(--ink); -webkit-appearance:none; appearance:none; }
input[type=date], input[type=time] { min-height:46px; }
textarea { min-height:76px; resize:vertical; }
.err { background:var(--warn); color:#fff; border-radius:12px; padding:10px 12px; margin-bottom:10px; line-height:1.45; }
.box { background:#fff6ec; border:2px solid var(--orange); border-radius:12px; padding:10px 12px; margin-bottom:10px; line-height:1.5; }
.div { height:1px; background:#EAF0F4; }
.link { background:none; border:0; color:var(--navy); font-weight:bold; font-size:16px; padding:6px 0; }
.link.red { color:var(--red); font-weight:normal; font-size:14.5px; }
.badge { display:inline-block; background:var(--red); color:#fff; font-size:11px; font-weight:bold; border-radius:9px; padding:0 6px; margin-left:6px; line-height:17px; vertical-align:middle; }
.newtag { display:inline-block; background:var(--red); color:#fff; font-size:10.5px; font-weight:bold; border-radius:5px; padding:0 5px; margin-left:6px; flex:none; }
.tag { display:inline-block; color:#fff; font-size:11.5px; font-weight:bold; border-radius:5px; padding:1px 6px; flex:none; }
.scard { overflow-y:auto; -webkit-overflow-scrolling:touch; margin-top:4px; }
.chev { display:inline-block; width:26px; height:26px; border-radius:13px; background:var(--tealsoft); color:var(--teal); text-align:center; line-height:26px; font-size:12px; font-weight:bold; flex:none; }
/* 首頁上面 */
.hero { background:var(--grad); color:#fff; border-radius:0 0 26px 26px; position:relative; overflow:hidden; padding:16px 18px 18px; padding-top:calc(16px + env(safe-area-inset-top)); }
.hero:before { content:''; position:absolute; width:72vw; height:72vw; max-width:420px; max-height:420px; border-radius:50%; background:rgba(255,255,255,.10); right:-26vw; top:-34vw; }
.hero:after { content:''; position:absolute; width:40vw; height:40vw; max-width:240px; max-height:240px; border-radius:50%; background:rgba(255,255,255,.07); left:-18vw; bottom:-22vw; }
.hero-in { max-width:680px; margin:0 auto; position:relative; z-index:1; }
.wx { background:rgba(255,255,255,.18); border-radius:16px; padding:8px 12px; text-align:center; border:0; color:#fff; flex:none; margin-left:10px; }
.hint { background:rgba(255,255,255,.18); border-radius:10px; padding:5px 10px; font-size:13.5px; display:inline-block; margin-top:10px; border:0; color:#fff; text-align:left; }
.wxbar { background:rgba(0,0,0,.15); border-radius:12px; padding:8px 10px; font-size:14px; line-height:1.45; margin-top:12px; }
/* 我的工地 */
.sitebox { border:1.5px solid var(--line); border-radius:12px; padding:8px 12px; background:#fff; text-align:left; width:100%; display:block; }
.siteopt { border:0; border-bottom:1px solid #EAF0F4; background:none; padding:10px 4px; text-align:left; width:100%; display:block; }
.enter { border:0; border-radius:14px; background:var(--grad); color:#fff; font-size:16px; font-weight:bold; padding:14px; white-space:nowrap; flex:none; }
.bar { height:6px; border-radius:4px; background:var(--bluesoft); margin-top:4px; overflow:hidden; }
.bar > i { display:block; height:100%; background:var(--grad); border-radius:4px; }
.rem { padding:7px 0; font-size:14.5px; line-height:1.4; }
.rem.hot { color:var(--warn); font-weight:bold; }
.tabs { display:flex; gap:6px; }
.tab { flex:1; border:0; border-radius:12px; background:var(--soft); padding:8px 4px; font-size:15px; font-weight:bold; }
.tab.on { background:var(--teal); color:#fff; }
.tbox { width:22px; height:22px; border-radius:5px; border:2px solid #5D7486; background:#fff; color:#fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; padding:0; }
.tbox.done { background:#9AA8B4; border-color:#9AA8B4; }
.trow { display:flex; align-items:flex-start; gap:6px; padding:4px 0; }
.trow .t { font-size:15px; line-height:1.35; padding-top:2px; word-break:break-word; }
.trow.done .t { color:#98A2B3; text-decoration:line-through; }
.who { font-size:12.5px; color:var(--todo); font-weight:bold; display:block; }
.news { display:flex; gap:10px; padding:8px 0; align-items:flex-start; }
.ico { width:34px; height:34px; border-radius:17px; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
.nsub { font-size:13px; color:#9A3412; background:#FFF6EC; border-radius:6px; padding:1px 6px; margin-top:2px; display:inline-block; }
.days { display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-top:8px; }
.day { min-width:74px; border-radius:12px; background:#F4F8F9; padding:8px 4px; text-align:center; flex:none; }
.day.rain { background:#E6F0FB; }
/* 工地頁、清單 */
.tile { display:flex; align-items:center; gap:14px; width:100%; background:#fff; border:0; border-radius:18px; padding:13px 14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(24,59,86,.12); text-align:left; }
.tile .em { width:50px; height:50px; border-radius:25px; display:flex; align-items:center; justify-content:center; font-size:24px; flex:none; }
.tile b { font-size:19px; display:block; }
.arrow { color:var(--line); font-size:26px; flex:none; }
.item { background:#fff; border-radius:12px; padding:10px 12px; margin-bottom:9px; box-shadow:0 1px 2px rgba(24,59,86,.10); display:flex; align-items:center; gap:10px; width:100%; border:0; text-align:left; font-size:16px; }
.pdfph { width:60px; height:46px; border:1.5px solid #9AA3B0; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); flex:none; background:#fff; }
.key { flex:1; border:2px solid var(--navy); background:#fff; color:var(--navy); border-radius:10px; padding:9px; font-size:16px; font-weight:bold; }
.key.on { background:var(--navy); color:#fff; }
/* 我的工作 */
.entry { border:1.5px solid var(--line); border-radius:10px; padding:9px 10px; margin:6px 0; display:flex; gap:8px; align-items:center; background:#fafcfd; }
.entry.mine { border-color:var(--orange); background:#fff8ef; }
.entry .who2 { font-weight:bold; color:var(--navy); min-width:2.2em; }
.entry .body { flex:1; min-width:0; }
.thumbs { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:8px; }
.thumb { position:relative; padding-top:75%; background:#d5dde3; border-radius:8px; overflow:hidden; }
/* 單據的施作位置（2026-11-11）：沒填＝有框的「＋ 施作位置」，填了＝橘色 */
/* 工時、加班（使用者 2026-11-12）：加班一律紅字 */
.hrow { display:flex; align-items:center; gap:8px; margin-top:10px; }
.hrow b { width:40px; flex:none; font-size:16px; }
.hrow input[type=text] { width:84px; flex:none; font-size:19px; font-weight:bold; padding:8px 10px; }
.hrow .u { color:var(--muted); flex:none; }
.hrow .r { flex:1; font-weight:bold; font-size:14px; color:var(--navy); line-height:1.35; }
.hrow.ot b, .hrow.ot input[type=text], .hrow.ot .u, .hrow.ot .r { color:#D32F2F; }
.otx { color:#D32F2F; font-weight:bold; }
.loctag { display:block; width:100%; margin-top:4px; padding:3px 6px; border:1.5px solid var(--navy); border-radius:7px; background:#fff; color:var(--navy);
  font:inherit; font-size:13px; font-weight:bold; text-align:left; line-height:1.25; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.loctag.on { border-color:#E0662B; background:#FFF3E6; color:#B5440F; }
/* 單據／材料現場（第 29 版，2026-11-13） */
.kindtag { display:block; width:100%; margin-top:4px; padding:3px 6px; border:1.5px solid #E9B56B; border-radius:7px; background:#FDE7C7; color:#8A4B00; font-size:13px; font-weight:bold; text-align:left; }
.kindtag.site { border-color:#8CC4A6; background:#DFF0E6; color:#1F5E44; }
.kindpick { border:1px solid var(--line); background:#fff; color:#5D7486; border-radius:16px; padding:6px 12px; font-size:14px; }
.kindpick.on { border:2px solid #8A4B00; background:#FDE7C7; color:#8A4B00; font-weight:bold; }
.kindpick.site.on { border-color:#1F5E44; background:#DFF0E6; color:#1F5E44; }
.locline { margin:-4px 0 10px; padding:6px 10px; background:#FFF3E6; color:#B5440F; font-weight:bold; border-radius:0 0 10px 10px; }
.thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.thumb .x { position:absolute; top:3px; right:3px; background:rgba(0,0,0,.6); color:#fff; border:0; border-radius:10px; padding:1px 8px; font-weight:bold; }
.thumb .new { position:absolute; left:3px; bottom:3px; background:var(--orange); color:#fff; font-size:11px; border-radius:6px; padding:0 5px; }
.row2 { display:flex; gap:8px; }
.row2 > * { flex:1; min-width:0; }
.mat { display:flex; gap:6px; margin-bottom:6px; }
.mat input { padding:8px; }
.full img { width:100%; border-radius:10px; display:block; margin-bottom:8px; background:#d5dde3; min-height:120px; }
.hd { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
/* 日誌照片 */
.pgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.pgrid .ph { position:relative; padding-top:75%; border-radius:8px; overflow:hidden; background:#DDE5EA; }
.pgrid .ph img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
/* 點照片放大（使用者 2026-11-11）：黑底整頁，兩指縮放、點兩下放大／還原、左右滑換張 */
img[data-cap] { cursor:zoom-in; }
#pv { position:fixed; inset:0; z-index:1100; background:#000; color:#fff; overflow:hidden; user-select:none; -webkit-user-select:none; }
#pvstage { position:absolute; inset:0; touch-action:none; }
#pvimg { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:contain; transform-origin:50% 50%; will-change:transform; -webkit-user-drag:none; }
#pvmsg { position:absolute; left:0; right:0; top:45%; text-align:center; font-size:15px; color:rgba(255,255,255,.8); line-height:22px; }
#pv .pvtop { position:absolute; left:0; right:0; top:0; display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,.65); padding:calc(4px + env(safe-area-inset-top)) 14px 4px 6px; }
#pv .pvtop button { background:none; border:0; color:#fff; font-size:18px; font-weight:bold; padding:10px 12px; }
#pv .pvbot { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.65); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
#pv .pvbot b { font-size:16px; }
#pv #pvx { font-size:14px; line-height:19px; color:rgba(255,255,255,.9); white-space:pre-wrap; }
#pv .pvhint { font-size:12px; line-height:16px; color:rgba(255,255,255,.6); margin-top:6px; }
#pv .pvnav { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:64px; border:0; border-radius:12px; background:rgba(0,0,0,.4); color:#fff; font-size:30px; left:8px; }
#pv .pvnav.r { left:auto; right:8px; }
#pv.nobars .pvtop, #pv.nobars .pvbot, #pv.nobars .pvnav { display:none; }
/* 月曆 */
.mgrid { display:grid; grid-template-columns:repeat(7, 1fr); text-align:center; }
.mgrid .h { font-size:12.5px; color:var(--muted); padding:4px 0; }
.mcell { height:46px; display:flex; align-items:center; justify-content:center; }
.mcell button { width:40px; height:42px; border:0; border-radius:11px; background:none; font-size:15.5px; padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.mcell button.today { background:var(--tealsoft); font-weight:800; }
.mcell button.sel { background:var(--blue); color:#fff; font-weight:800; }
.dots { height:6px; display:flex; gap:2px; justify-content:center; margin-top:2px; }
.dots i { width:5px; height:5px; border-radius:3px; background:var(--orange); display:block; }
.sel .dots i { background:#fff; }
.ev { display:flex; gap:8px; padding:9px 0; border:0; border-top:1px solid #EAF0F4; width:100%; background:none; text-align:left; font-size:16px; }
.sitechip { font-size:12px; color:#0F766E; background:var(--tealsoft); border-radius:6px; padding:1px 6px; font-weight:bold; margin-left:6px; }
.stepper { display:flex; align-items:center; background:#F1F7F8; border-radius:10px; margin-top:8px; }
.stepper > button { border:0; background:none; font-size:28px; color:var(--teal); padding:2px 14px; }
.stepper > button:disabled { color:var(--line); }
.stepper .mid { flex:1; text-align:center; color:var(--ink); }
/* PDF */
#pdfpages canvas { display:block; width:100%; height:auto; background:#fff; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.2); }
/* 施工單記號（第 15 版）：每頁一個框，記號蓋在上面；下面一排按鈕 */
#pdfpages .pgw { position:relative; margin-bottom:12px; }
#pdfpages .pgw canvas { margin-bottom:0; }
#pdfpages .pgw canvas.ov { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; background:transparent; box-shadow:none; }
#pdfpages .pglab { position:absolute; left:4px; top:4px; background:rgba(42,47,54,.67); color:#fff; font-size:13px; font-weight:bold; border-radius:6px; padding:2px 7px; }
#pdfpages .pgbar { display:flex; gap:8px; justify-content:flex-end; padding:6px 2px 0; }
#pdfpages .pgbar button { border:0; border-radius:16px; padding:7px 14px; font-size:15px; font-weight:bold; }
.snpen { background:#E03131; color:#fff; }
.sncnt { background:#FFF3A0; color:#8A6D00; }
/* 畫記號（整個畫面） */
#ned { position:fixed; inset:0; z-index:60; background:#5A6270; display:flex; flex-direction:column; }
#ned .top { flex:none; }
#ned .stage { flex:1; position:relative; overflow:hidden; touch-action:none; }
#ned .pbox { position:absolute; left:0; top:0; transform-origin:0 0; background:#fff; }
#ned .pbox canvas { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
#ned .tools { flex:none; background:#fff; padding:6px 8px calc(8px + env(safe-area-inset-bottom)); }
#ned .tools .hint { font-size:12px; color:var(--muted); padding:0 4px 4px; }
#ned .tools .row3 { display:flex; flex-wrap:wrap; gap:6px; }
#ned .tk { border:1px solid var(--line); background:#fff; border-radius:18px; padding:7px 11px; font-size:14px; display:flex; align-items:center; gap:5px; }
#ned .tk.on { border-width:2px; font-weight:bold; }
#ned .tk i { width:12px; height:12px; border-radius:6px; display:inline-block; }
#ned .tk:disabled { color:var(--line); }
#ned .ndlg { position:absolute; left:12px; right:12px; top:70px; background:#fff; border-radius:16px; padding:14px; box-shadow:0 8px 24px rgba(0,0,0,.3); z-index:2; max-width:520px; margin:0 auto; }
#ned .ndlg textarea { width:100%; box-sizing:border-box; min-height:70px; font-size:17px; border:1.5px solid var(--line); border-radius:10px; padding:8px; font-family:inherit; }

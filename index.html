<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>柏捷工地</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="柏捷工地">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!--
  柏捷工地App「iPhone 網頁版」（使用者 2026-11-08：iPhone 不能裝 App，用網頁＋Safari「加入主畫面」）。
  2026-11-10 改版（使用者：「iphone版的線上網址他沒有做更新，依樣是舊版的」）：跟 Android App 0.9.36 用代碼登入的畫面一樣——
    首頁：問候＋所在地天氣、我的工地（進入）、今日提醒／待辦、這週行程、最新消息（＋注意事項）、這週天氣。
    施工人員：進入 → 我的工作（傳工作、照片、單據照片）＋看施工日誌。
    老闆、主任、公司：進入 → 工地頁（施工日誌、鋼筋施工單、混凝土灌漿數量、發包、待辦事項、3D 結構＝3d.html）；行事曆可以看、新增、修改。
  iPhone 網頁做不到的：桌面小工具、App 關著時的通知。
  放在自己的網址（不是嵌在 Google 頁面裡），iPhone 才記得住代碼；資料直接傳給收件服務（跟 App 同一套）。
  代碼：第一次輸入、登入成功後記在這支手機，之後鎖住不能改，只按「登入」。
  同一支手機打錯 3 次鎖 30 分鐘，之後再錯就一直鎖，要管理者在「人員管理」解除（收件服務第 5 版記錄）。
  這個檔案公開沒關係：裡面沒有任何代碼或密碼。
-->
<style>
:root { --teal:#16A6A0; --blue:#2F80ED; --navy:#1C5D99; --orange:#F2994A; --bg:#F1F7F8; --ink:#183B56; --muted:#5D7486; --line:#C6D3DC;
  --green:#1E9E6A; --todo:#1E8E5A; --red:#E5383B; --warn:#E0662B; --tealsoft:#D9F2F0; --bluesoft:#DCEBFB; --purple:#7A4BB0; --soft:#F1F5F7;
  --grad:linear-gradient(120deg, #16A6A0, #2F80ED); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size:17px; -webkit-text-size-adjust:100%; }
button { font-family:inherit; cursor:pointer; color:inherit; }
.top { background:var(--grad); color:#fff; padding:10px 6px; padding-top:calc(10px + env(safe-area-inset-top)); display:flex; align-items:center; gap:2px; position:sticky; top:0; z-index:5; min-height:54px; }
.top h1 { font-size:19px; margin:0 0 0 6px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top button { background:none; border:0; color:#fff; font-size:15px; padding:6px 10px; font-weight:bold; white-space:nowrap; }
.top .back { font-size:30px; line-height:1; padding:0 10px 3px; font-weight:normal; }
.wrap { max-width:680px; margin:0 auto; padding:12px 12px 48px; }
.card { background:#fff; border-radius:16px; padding:13px 14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(24,59,86,.10); }
.ttl { font-size:17px; font-weight:800; }
.row { display:flex; align-items:center; gap:8px; }
.grow { flex:1; min-width:0; }
.label { font-size:13.5px; color:var(--muted); margin:2px 0 6px; font-weight:bold; }
.sub { font-size:13px; color:var(--muted); }
.note { font-size:13px; color:var(--muted); line-height:1.5; }
/* 一組可以點的選項：一樣大的格子排成幾欄（使用者 2026-11-21「你的每個排版都要漂亮不要東跳西跳」「其他比較早做的畫面…全部檢查」）。
   以前是長短不一、自動換行的小標籤。幾欄（--cols）是 gridChips() 照最長那一顆算的（App 的 ChipRow 同一套）。
   .scroll＝一整排左右滑的篩選列、.keep＝靠右的小按鈕：這兩種維持一排，只換成同樣的方格樣子。 */
.chips { display:grid; grid-template-columns:repeat(var(--cols, 3), minmax(0, 1fr)); gap:6px; }
.chips > :not(.chip) { grid-column:1 / -1; }   /* 不是選項的東西（「讀取中…」那種字）：自己佔一整排 */
.chips.scroll, .chips.keep { display:flex; flex-wrap:wrap; }
.chips.scroll { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; scrollbar-width:none; }
.chips.scroll::-webkit-scrollbar { display:none; }
.chip { border:1.5px solid var(--line); background:#fff; border-radius:11px; margin:0; padding:4px 8px; min-height:38px; min-width:0; font-size:15px; font-weight:bold; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chips.scroll .chip, .chips.keep .chip { flex:none; padding:4px 12px; }
.chip.on { background:var(--teal); border-color:var(--teal); color:#fff; font-weight:bold; }
.chip.small { min-height:36px; font-size:14.5px; }
/* 匯出視窗「要匯出哪些」：整排的「全部」＋ 3×2 一樣大的格子（使用者 2026-11-21「排版要漂亮」：原本一顆一顆長短不一、排得亂） */
.xall, .xcell { border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:14px; margin:0; }
.xall { display:block; width:100%; font-size:16.5px; font-weight:bold; padding:11px 0; }
.xgrid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; margin-top:8px; }
.xnote { margin-top:12px; font-size:14.5px; line-height:1.55; color:var(--muted); }
.xnote b { display:inline-block; min-width:46px; color:var(--ink); }
.xcell { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:9px 2px; min-height:60px; }
.xcell b { font-size:16.5px; line-height:1.2; white-space:nowrap; }
.xcell span { font-size:13px; color:var(--muted); line-height:1.2; }
.xall.on, .xcell.on { background:var(--teal); border-color:var(--teal); color:#fff; }
.xcell.on span { color:#fff; opacity:.9; }
.xcell:disabled { opacity:.38; }
/* 一樣大的格子排成幾欄（位置、單位、號數、形式、排法都用這個；使用者 2026-11-21「你的每個排版都要漂亮不要東跳西跳」：不要長短不一、自動換行的小標籤） */
.tg { display:grid; gap:6px; margin-top:6px; }
.tc { border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:11px; margin:0; padding:4px 2px; min-height:38px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; overflow:hidden; }
.tc b { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; line-height:1.25; }
.tc span { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px; color:var(--muted); line-height:1.2; }
.tc.two, .tg.tall .tc { min-height:48px; }   /* tall＝這一組有的格子是兩行：全部一樣高 */
/* 施工進度（第 67 版）：上面三格、圖例、月／週、甘特圖（左邊名稱固定、右邊左右滑）、每一項、編輯預計 */
.tg.pgsum { grid-template-columns:repeat(3, minmax(0, 1fr)); margin-top:8px; } .tg.pgsum .tc { min-height:60px; cursor:default; }
.tg.pgsum .tc b { font-size:20px; } .tg.pgsum .tc.dim b { font-size:16px; color:var(--muted); } .tg.pgsum .tc span { font-size:12px; }
.pglg { display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); align-items:center; }
.pglg i { display:inline-block; width:18px; height:8px; border-radius:3px; margin-right:4px; vertical-align:middle; }
.pgunit { display:flex; align-items:center; gap:6px; margin:8px 0 6px; } .pgunit > span { font-size:13px; color:var(--muted); margin-right:2px; }
.pgunit .tc { width:64px; min-height:34px; flex:none; }
.gt { display:flex; } .gtn { width:114px; flex:none; }
.gtn .gtr { display:flex; align-items:center; width:100%; height:34px; border:0; background:none; text-align:left; font-weight:bold; font-size:13px; color:var(--ink); padding:0 4px 0 0; margin:0; border-radius:0; }
.gtn .gtr span { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .gtn .gtr em { font-style:normal; font-size:11px; color:var(--muted); margin-left:2px; }
.gtn .gtr.fl { font-size:13.5px; font-weight:800; } .gtn .gtr.fl em { color:var(--teal); } .gtn .gtr.it { padding-left:4px; font-size:12.5px; } .gtn .gtr em.ok { color:#1E9E6A; }
.gtn .gtr.none { color:var(--muted); }
.gtn .gtr .ar, .pgst .ar { flex:none; width:12px; font-size:10px; color:var(--muted); text-align:right; margin-right:3px; } .gtn .gtr.sub .ar { width:22px; } .gtn .gtr.sub { font-size:12px; font-weight:500; }
.gtn .gtr.oth span, .pgst.oth b { color:var(--muted); }
.gtb.fl { background-color:#EEF5F7; } .gtb .ga.sum { background:#0E7C86; height:10px; top:17px; } .gtb .ga.none { background:#A9B8C3; }
.pgfl { display:flex; width:100%; text-align:left; background:none; border:0; border-top:1px solid #EEF2F5; border-radius:0; padding:9px 0 4px; margin:0; align-items:center; }
.pgfl b { flex:1; font-size:15.5px; color:var(--ink); } .pgfl b.none { color:var(--muted); } .pgfl span { font-size:13px; color:var(--muted); font-weight:normal; }
.pgst { padding-left:14px !important; border-top:0 !important; }
.tg.pgpct { grid-template-columns:repeat(5, minmax(0, 1fr)); margin-top:4px; } .tg.pgpct .tc { min-height:40px; }
.gax { height:22px; position:relative; } .gax span { position:absolute; top:3px; font-size:11px; color:var(--muted); white-space:nowrap; }
.gts { flex:1; min-width:0; overflow-x:auto; -webkit-overflow-scrolling:touch; } .gtc { position:relative; }
.gtb { position:relative; height:34px; background-image:linear-gradient(to right, #E3EAEF 1px, transparent 1px); cursor:pointer; }
.gtb.alt { background-color:#F6F9FB; } .gtb i { position:absolute; height:8px; border-radius:4px; }
.gtb .gp { top:7px; background:#BFD8F2; } .gtb .ga { top:18px; background:#1E9E6A; } .gtb .ga.late { background:#F2994A; }
.gtoday { position:absolute; top:22px; bottom:0; width:2px; background:var(--red); pointer-events:none; }
.pgst { display:flex; width:100%; text-align:left; background:none; border:0; border-top:1px solid #EEF2F5; border-radius:0; padding:7px 0; margin:0; gap:8px; align-items:flex-start; }
.pgst b { width:86px; flex:none; font-size:14.5px; color:var(--ink); } .pgst span { flex:1; font-size:13.5px; color:var(--muted); line-height:19px; font-weight:normal; } .pgst span.bad { color:var(--red); }
.pgpr { padding:6px 0 8px; border-bottom:1px solid #EEF2F5; }
.pgpr .r1 { display:grid; grid-template-columns:70px minmax(0, 1fr) 24px; gap:6px; align-items:center; }
.pgpr .r2 { display:grid; grid-template-columns:70px minmax(0, 1fr) minmax(0, 1fr); gap:6px; margin-top:5px; padding-right:30px; }
.pgpr .r2 input[list]::-webkit-calendar-picker-indicator { display:none !important; }
/* 工項累計（11/23e）：每個工項一張卡，一組一列（名字＋日期、天數、工數） */
.itc .ith { display:flex; width:100%; background:none; border:0; padding:2px 0; margin:0; align-items:baseline; text-align:left; border-radius:0; }
.itc .ith b { flex:1; font-size:16.5px; color:var(--ink); } .itc .ith span { font-size:13.5px; color:var(--muted); font-weight:bold; }
.itr { display:grid; grid-template-columns:minmax(0, 1fr) 44px 58px; align-items:center; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid #EEF2F5; border-radius:0; padding:5px 0; margin:0; min-height:46px; font-weight:normal; }
.itr.noq { grid-template-columns:minmax(0, 1fr) 44px; }
.itr > span:not(.nm) { text-align:right; font-size:15px; color:var(--ink); }
.itr .nm b { display:block; font-size:14.5px; color:var(--ink); line-height:19px; } .itr .nm small { display:block; font-size:11.5px; color:var(--muted); }
.itr .nm em { font-style:normal; font-size:11px; background:var(--teal); color:#fff; border-radius:5px; padding:0 5px; margin-left:4px; vertical-align:1px; }
.itr .ck { font-style:normal; font-size:18px; color:var(--muted); float:left; width:24px; } .itr.on .ck { color:var(--teal); }
.itr.mg { background:#F2FAF9; } .itr.on { background:#E3F5F3; }
.itr.ithd { min-height:0; font-size:12px; color:var(--muted); border-bottom:1px solid #EEF2F5; margin-top:6px; } .itr.ithd > span { font-size:12px; color:var(--muted); }
/* 11/25c：每一組後面寫是哪一家做的；別家做的、進的料（日誌的材料／機具）排在那個工項後面：名字、天數、數量＋單位 */
.itr .nm small i { font-style:normal; } .itr .nm small i.ov { color:#002060; font-weight:bold; }
.itr.mt { grid-template-columns:minmax(0, 1fr) 44px 108px; } .itr.mt .nm b { color:#002060; }
.itsec { font-size:12.5px; font-weight:bold; color:#002060; margin-top:10px; padding:6px 0 0; border-top:2px solid #E3E9F7; }
.itc .ith span { text-align:right; white-space:nowrap; padding-left:8px; } .itc .ith span i.bj { display:block; font-style:normal; font-size:12px; color:#002060; }
.itr.ithd > span:first-child { text-align:left; }
.tg.itbtn { margin-top:8px; grid-template-columns:1fr; } .tg.two.itbtn { grid-template-columns:1fr 1fr; }
.itday { display:flex; justify-content:space-between; font-size:15px; padding:2px 0; } .itday span:last-child { color:var(--muted); }   /* 部位那一格窄：不要選單箭頭，打字就跳建議 */
.pgst.sub { padding-left:28px !important; } .pgst.sub b { width:72px; font-size:14px; } .pgst .ar { width:auto; margin-right:2px; font-size:11px; }
.pgpr input { margin:0; padding:6px; font-size:14px; min-width:0; width:100%; box-sizing:border-box; height:40px; letter-spacing:0; }
.pgx { border:0; background:none; color:var(--muted); font-size:16px; padding:0; margin:0; width:22px; }
.tg.extg { grid-template-columns:repeat(3, minmax(0, 1fr)); margin-top:4px; }   /* 工地展延：三格一樣大（不展延／展延 1 次／展延 2 次） */
.tg.extg .tc { min-height:54px; } .tg.extg .tc span { font-size:13px; } .tg.extg .tc:disabled { color:var(--line); }
.tc.on { background:var(--teal); border-color:var(--teal); color:#fff; } .tc.on span { color:#fff; }
/* 誰看得到哪個資料夾（開發者設定；第 65 版）：左邊資料夾名稱，右邊公司、施工人員各一格，每格一樣大 */
.vgrid { display:grid; grid-template-columns:92px minmax(0, 1fr) minmax(0, 1fr); gap:7px; align-items:center; }
.vgrid .vh { text-align:center; font-size:15px; font-weight:bold; color:var(--navy); padding-bottom:1px; }
.vgrid .vn { font-size:16.5px; font-weight:bold; white-space:nowrap; }
.vgrid .tc { min-height:44px; }
.tc.off { background:#FDECEC; border-color:#E9A5A6; color:#C62828; }
/* 兩欄一樣寬的輸入格：上面小字寫是什麼，下面輸入框 */
.fg { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; margin-top:8px; }
.fg .fl { font-size:13px; color:var(--muted); margin-bottom:3px; white-space:nowrap; }
.fg input { width:100%; box-sizing:border-box; text-align:center; font-size:19px; font-weight:bold; }
.chip.add { background:var(--todo); border-color:var(--todo); color:#fff; font-weight:bold; }
.chip.addl { background:#eef3fa; border-color:#b9c8de; color:var(--navy); font-weight:bold; }
.chip[data-lp] { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
.chip.lping { transform:scale(.94); border-color:var(--red); }
.omrow { display:flex; align-items:center; gap:8px; background:#FFF6EC; border-radius:8px; padding:6px 8px; margin:4px 0; font-size:14.5px; }
.omrow[data-act] { cursor:pointer; }
.omrow .st { font-size:12.5px; font-weight:bold; color:#B5651D; white-space:nowrap; }
.omrow .st.ok { color:var(--green); }
.omrow .ed { font-size:13px; font-weight:bold; color:var(--navy); white-space:nowrap; }
.big { display:block; width:100%; border:0; border-radius:14px; background:var(--grad); color:#fff; font-size:18px; font-weight:bold; padding:14px; margin:4px 0 10px; }
.big:disabled { background:#cbd5dc; }
.ghost { display:block; width:100%; border:2px solid var(--navy); background:#fff; color:var(--navy); border-radius:12px; font-size:16.5px; font-weight:bold; padding:11px; margin-bottom:10px; }
.ghost.red { border-color:var(--red); color:var(--red); }
.ghost.dim { border-color:var(--line); color:var(--muted); font-weight:normal; }
.pill { border:0; border-radius:14px; background:var(--grad); color:#fff; font-size:13.5px; font-weight:bold; padding:5px 11px; white-space:nowrap; margin-left:6px; }
.pill:disabled { opacity:.45; }
input[type=text], input[type=date], input[type=time], textarea { width:100%; font-size:17px; padding:10px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; background:#fff; color:var(--ink); -webkit-appearance:none; appearance:none; }
input[type=date], input[type=time] { min-height:46px; }
textarea { min-height:76px; resize:vertical; }
.err { background:var(--warn); color:#fff; border-radius:12px; padding:10px 12px; margin-bottom:10px; line-height:1.45; }
.box { background:#fff6ec; border:2px solid var(--orange); border-radius:12px; padding:10px 12px; margin-bottom:10px; line-height:1.5; }
.div { height:1px; background:#EAF0F4; }
.link { background:none; border:0; color:var(--navy); font-weight:bold; font-size:16px; padding:6px 0; }
.link.red { color:var(--red); font-weight:normal; font-size:14.5px; }
.badge { display:inline-block; background:var(--red); color:#fff; font-size:11px; font-weight:bold; border-radius:9px; padding:0 6px; margin-left:6px; line-height:17px; vertical-align:middle; }
.newtag { display:inline-block; background:var(--red); color:#fff; font-size:10.5px; font-weight:bold; border-radius:5px; padding:0 5px; margin-left:6px; flex:none; }
.tag { display:inline-block; color:#fff; font-size:11.5px; font-weight:bold; border-radius:5px; padding:1px 6px; flex:none; }
.scard { overflow-y:auto; -webkit-overflow-scrolling:touch; margin-top:4px; }
.chev { display:inline-block; width:26px; height:26px; border-radius:13px; background:var(--tealsoft); color:var(--teal); text-align:center; line-height:26px; font-size:12px; font-weight:bold; flex:none; }
/* 首頁上面 */
.hero { background:var(--grad); color:#fff; border-radius:0 0 26px 26px; position:relative; overflow:hidden; padding:16px 18px 18px; padding-top:calc(16px + env(safe-area-inset-top)); }
.hero:before { content:''; position:absolute; width:72vw; height:72vw; max-width:420px; max-height:420px; border-radius:50%; background:rgba(255,255,255,.10); right:-26vw; top:-34vw; }
.hero:after { content:''; position:absolute; width:40vw; height:40vw; max-width:240px; max-height:240px; border-radius:50%; background:rgba(255,255,255,.07); left:-18vw; bottom:-22vw; }
.hero-in { max-width:680px; margin:0 auto; position:relative; z-index:1; }
.wx { background:rgba(255,255,255,.18); border-radius:16px; padding:8px 12px; text-align:center; border:0; color:#fff; flex:none; margin-left:10px; }
.hint { background:rgba(255,255,255,.18); border-radius:10px; padding:5px 10px; font-size:13.5px; display:inline-block; margin-top:10px; border:0; color:#fff; text-align:left; }
.wxbar { background:rgba(0,0,0,.15); border-radius:12px; padding:8px 10px; font-size:14px; line-height:1.45; margin-top:12px; }
/* 我的工地 */
.sitebox { border:1.5px solid var(--line); border-radius:12px; padding:8px 12px; background:#fff; text-align:left; width:100%; display:block; }
.siteopt { border:0; border-bottom:1px solid #EAF0F4; background:none; padding:10px 4px; text-align:left; width:100%; display:block; }

/* 電腦也能用（使用者 2026-11-10「我想要電腦也能打開的」「排法要舒適，不要那麼擠（手機才需要）」「電腦就是方便人員查看操控」）：
   手機照舊一欄；電腦整頁放大（--z：一般 1.05、24／27 吋 1.2、29 吋 21:9 與 40 吋長條 1.3）、間距拉開，
   首頁兩欄（長條螢幕三欄），卡片跟著螢幕高度拉長；清單、表單那幾頁窄一點比較好讀 */
:root { --z:1; }

.pc-only { display:none; }

  .tile { padding:18px 20px; margin-bottom:18px; }
  .item { padding:14px 16px; margin-bottom:12px; }

  .pgrid { grid-template-columns:repeat(3, 1fr); gap:16px; }

  .phone-only { display:none; }

  button, [data-act] { cursor:pointer; }

function api(action, body) {

  for (var k in (body || {})) req[k] = body[k];

  var text = JSON.stringify(req);

    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: text })
      .then(function (res) { return res.json(); }, function () { throw { error: '連不上收件服務（網路有問題，等一下再試）' }; })
      .then(null, function (e) { throw (e && e.error ? e : { error: '收件服務回覆看不懂，等一下再試' }); });
  };
  return (apiResend(action, body) ? apiHedge(once, API_GAP_BY[action] || API_GAP, API_TRIES) : apiCap(once(), API_WAIT_MAX))
    .then(function (r) {

}

    var trash = gone.length && photoDir ? dChildren(photoDir).then(function (fs) {
      return Promise.all(gone.map(function (p) { var f = fs.filter(function (x) { return x.name === p.file; })[0]; return f ? dTrash(f.id).catch(function () { }) : null; }));
    }).catch(function () { }) : Promise.resolve();
    return trash.then(function () { return r; });
  }).then(function (r) {
    if (S.dl !== dl) return;
    dl.e0 = r.merged; dl.e = dlCopy(r.merged); dl.fileId = r.id; dl.dirty = false; dl.busy = '';
    var d = new Date(); dl.msg = '✅ 已存到雲端 ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + '（摺疊機同步後就看得到）';
    dlIdbPut(dlKey(dl), null);
    delete LOGCACHE[logKey(site, date)]; delete LOGCACHE[logKey(site, null)];
    webPing('log', site);   // 叫醒摺疊機、老闆主任的手機馬上抓（收件服務第 32 版推播；日誌只更新、不跳）
    render(); dlThumbs();
  }).catch(function (e) {
    if (S.dl !== dl) return;
    dl.busy = ''; dl.err = dlErrText(e) + '。這台還留著，有網路再按一次「存到雲端」。';
    dlIdbPut(dlKey(dl), { e: dl.e, newPh: dl.newPh, base: (dl.e0 || {}).savedAt || '', at: dlNow() });
    render();
  });
}
ACT.dlopenday = function (v) { dlOpen(v || todayYmd()); };
document.addEventListener('input', function (ev) {
  var k = ev.target.getAttribute && ev.target.getAttribute('data-df'); if (!k) return;
  var dl = S.dl; if (!dl || !dl.e) return; var v = ev.target.value;
  if (k === 'date') return;
  if (k === 'ntext' || k === 'nother') { if (dl.note) { if (k === 'ntext') { dl.note.text = v; dl.note.err = ''; } else dl.note.other = v; } return; }   // 記一筆：按「存」才算
  if (k === 'disc') dl.e.discussion = v;
  else if (k === 'iv' && dl.cur) dl.cur.vendor = v;
  else if (k.indexOf('lv.') === 0 && dl.cur) { var lvl = dl.cur.lines[+k.split('.')[1]]; if (lvl) lvl.vendor = v; }   // 這一行的廠商（2026-11-21）
  else if (k.indexOf('lp.') === 0 && dl.cur) { var lpl = dl.cur.lines[+k.split('.')[1]]; if (lpl) { lpl.people = Math.max(0, Math.min(99, parseInt(v, 10) || 0)); if (lpl.people > 0) { dl.cur.people = 0; dl.cur.people2 = 0; dl.cur.qtyText = ''; } } }
  else if (k.indexOf('il.') === 0 && dl.cur) {
    // 有細項的大項：框裡打的是細項後面的字，【細項】留著（2026-11-18）
    var ln = dl.cur.lines[+k.split('.')[1]], sub = subsOf(dl.cur.category).length ? splitSub(dl.cur.category, ln.text).sub : '';
    ln.text = sub ? '【' + sub + '】' + v : v;
  }
  else if (k.indexOf('mat.') === 0) { var p = k.split('.'); dl.e.materials[+p[1]][p[2]] = v; }
  else if (k === 'pline') { var ph = dlCurPhoto(dl); if (ph) ph.line = v; }
  if (dl.cur && dl.view === 'item') {   // 每一行下面那一條、合計跟著換
    document.querySelectorAll('[data-lsum]').forEach(function (el) { el.textContent = dlLineSum(dl.cur, +el.getAttribute('data-lsum')); });
    var tt = document.getElementById('dltot'); if (tt) tt.textContent = dlTotalText(dl.cur);
  }
  dlTouch();
});
document.addEventListener('change', function (ev) {
  if (!(ev.target.getAttribute && ev.target.getAttribute('data-df') === 'date')) return;
  var v = ev.target.value; if (/^\d{4}-\d{2}-\d{2}$/.test(v)) ACT.dlday(v);
});
ACT.dlcal = function () { var dl = S.dl; if (!dl || dl.busy) return; dlCloseItem(dl); S.modal = { type: 'dates', dl: 1, month: dl.date.slice(0, 7) }; renderModal(); };

// ---------- 往左滑才出現「刪除」（使用者 2026-11-13「能否做成往左滑才會出現刪除」）：手指往左滑；電腦滑鼠按住往左拖 ----------
// 滑超過一半停在打開，不然彈回去；打開時點那一列＝收回去（不會順便打開）；點別的地方也會收回去
var SWW = 84, SW = { r: null, x0: 0, y0: 0, base: 0, dx: 0, drag: false, eat: 0 };
function swShut(keep) { [].forEach.call(document.querySelectorAll('.swp.open'), function (r) { if (r !== keep) r.classList.remove('open'); }); }
document.addEventListener('pointerdown', function (ev) {
  if (ev.button) return;
  var t = ev.target, r = t.closest ? t.closest('.swp') : null;
  swShut(r);
  if (!r || t.closest('.swdel')) { SW.r = null; return; }
  SW.r = r; SW.x0 = ev.clientX; SW.y0 = ev.clientY; SW.base = r.classList.contains('open') ? -SWW : 0; SW.dx = SW.base; SW.drag = false;
});
document.addEventListener('pointermove', function (ev) {
  var r = SW.r; if (!r) return;
  var mx = ev.clientX - SW.x0, my = ev.clientY - SW.y0;
  if (!SW.drag) {
    if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
    if (Math.abs(my) >= Math.abs(mx)) { SW.r = null; return; }   // 上下捲，不是滑
    SW.drag = true; r.classList.add('drag');
  }
  SW.dx = Math.max(-SWW, Math.min(0, SW.base + mx));
  r.querySelector('.item').style.transform = 'translateX(' + SW.dx + 'px)';
});
function swEnd(cancel) {
  var r = SW.r; SW.r = null; if (!r) return;
  if (!SW.drag) { if (!cancel && r.classList.contains('open')) { r.classList.remove('open'); SW.eat = Date.now(); } return; }
  r.classList.remove('drag'); r.querySelector('.item').style.transform = '';
  r.classList.toggle('open', !cancel && SW.dx < -SWW / 2);
  SW.eat = Date.now();
}
document.addEventListener('pointerup', function () { swEnd(false); });
document.addEventListener('pointercancel', function () { swEnd(true); });
// 滑完放開不要順便打開那一列
document.addEventListener('click', function (ev) { if (Date.now() - SW.eat < 500) { SW.eat = 0; ev.preventDefault(); ev.stopPropagation(); } }, true);

// ---------- 網頁有新版就自己換（使用者 2026-11-14「為何電腦版的格式沒有改」） ----------
// 電腦版（Edge 視窗）、iPad 主畫面的網頁常常一直開著，不會自己重新讀網頁 → 還是舊版。
// 每 5 分鐘、從背景回來時看一次雲端的網頁版本；不一樣就重新整理。正在打字、跳出視窗、寫日誌還沒存、上傳中、看照片、看 3D：先不換，
// 右下角出現「🔄 有新版，按這裡更新」，下次空下來再自己換。
var WEBNEW = { ver: '', at: 0 };
function webBusy() {
  if (S.modal || S.busy || S.route === 'edit' || (S.dl && S.dl.dirty) || (S.cfile && S.cfile.busy) || $('pv') || document.querySelector('iframe[src^="3d.html"]')) return true;
  var a = document.activeElement;
  return !!(a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && String(a.value || '').trim());
}
function webApply() {
  if (!WEBNEW.ver) return;
  // 同一個新版 2 分鐘內已經重新整理過、還是舊的（瀏覽器硬給舊的）：不要一直重新整理，只出按鈕
  var last = null; try { last = JSON.parse(sessionStorage.getItem('bojie.webreload') || 'null'); } catch (e) { }
  var looping = last && last.ver === WEBNEW.ver && Date.now() - last.at < 120000;
  if (!webBusy() && !looping) {
    try { sessionStorage.setItem('bojie.webreload', JSON.stringify({ ver: WEBNEW.ver, at: Date.now() })); } catch (e) { }
    location.reload(); return;
  }
  if ($('webnew')) return;
  var b = document.createElement('button'); b.id = 'webnew'; b.type = 'button';
  b.textContent = '🔄 網頁有新版（' + WEBNEW.ver + '），按這裡更新';
  b.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:60;border:0;border-radius:20px;padding:10px 16px;font-size:15px;font-weight:bold;color:#fff;background:#1C5D99;box-shadow:0 3px 10px rgba(0,0,0,.25)';
  b.addEventListener('click', function () { location.reload(); });
  document.body.appendChild(b);
}
function webCheck() {
  if (DRIVE_TEST || Date.now() - WEBNEW.at < 4 * 60000) return;
  WEBNEW.at = Date.now();
  // cache:'reload'：一定跟網站拿新的（順便把瀏覽器存的舊網頁換掉，重新整理才會拿到新的）
  fetch(location.pathname + location.search, { cache: 'reload' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
    var m = /var WEB_VERSION = '([^']+)'/.exec(t || '');
    if (m && m[1] !== WEB_VERSION) { WEBNEW.ver = m[1]; webApply(); }
  }).catch(function () { });
}
setInterval(function () { if (WEBNEW.ver) webApply(); else webCheck(); }, 5 * 60000);
document.addEventListener('visibilitychange', function () { if (document.hidden) return; if (WEBNEW.ver) webApply(); else webCheck(); });
setTimeout(webCheck, 20000);   // 打開 20 秒後先看一次（剛打開可能拿到瀏覽器存的舊網頁）

Object.keys(SITE_ACTS).forEach(function (k) { ACT[k] = SITE_ACTS[k]; });   // 開發者新增、改名、刪工地（使用者 2026-11-15 巡查 ⑤c）

if (S.gs) gsEnter(true); else if (FROM_SAPP && S.saved) { render(); ACT.login(); } else render();

<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>柏捷工地</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="柏捷工地">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!--
  柏捷工地App「iPhone 網頁版」（使用者 2026-11-08：iPhone 不能裝 App，用網頁＋Safari「加入主畫面」）。
  2026-11-10 改版（使用者：「iphone版的線上網址他沒有做更新，依樣是舊版的」）：跟 Android App 0.9.36 用代碼登入的畫面一樣——
    首頁：問候＋所在地天氣、我的工地（進入）、今日提醒／待辦、這週行程、最新消息（＋注意事項）、這週天氣。
    施工人員：進入 → 我的工作（傳工作、照片、單據照片）＋看施工日誌。
    老闆、主任、公司：進入 → 工地頁（施工日誌、鋼筋施工單、混凝土灌漿數量、發包、待辦事項）；行事曆可以看、新增、修改。
  iPhone 網頁做不到的：桌面小工具、App 關著時的通知。
  放在自己的網址（不是嵌在 Google 頁面裡），iPhone 才記得住代碼；資料直接傳給收件服務（跟 App 同一套）。
  代碼：第一次輸入、登入成功後記在這支手機，之後鎖住不能改，只按「登入」。
  同一支手機打錯 3 次鎖 30 分鐘，之後再錯就一直鎖，要管理者在「人員管理」解除（收件服務第 5 版記錄）。
  這個檔案公開沒關係：裡面沒有任何代碼或密碼。
-->
<style>
:root { --teal:#16A6A0; --blue:#2F80ED; --navy:#1C5D99; --orange:#F2994A; --bg:#F1F7F8; --ink:#183B56; --muted:#5D7486; --line:#C6D3DC;
  --green:#1E9E6A; --todo:#1E8E5A; --red:#E5383B; --warn:#E0662B; --tealsoft:#D9F2F0; --bluesoft:#DCEBFB; --purple:#7A4BB0; --soft:#F1F5F7;
  --grad:linear-gradient(120deg, #16A6A0, #2F80ED); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size:17px; -webkit-text-size-adjust:100%; }
button { font-family:inherit; cursor:pointer; color:inherit; }
.top { background:var(--grad); color:#fff; padding:10px 6px; padding-top:calc(10px + env(safe-area-inset-top)); display:flex; align-items:center; gap:2px; position:sticky; top:0; z-index:5; min-height:54px; }
.top h1 { font-size:19px; margin:0 0 0 6px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top button { background:none; border:0; color:#fff; font-size:15px; padding:6px 10px; font-weight:bold; white-space:nowrap; }
.top .back { font-size:30px; line-height:1; padding:0 10px 3px; font-weight:normal; }
.wrap { max-width:680px; margin:0 auto; padding:12px 12px 48px; }
.card { background:#fff; border-radius:16px; padding:13px 14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(24,59,86,.10); }
.ttl { font-size:17px; font-weight:800; }
.row { display:flex; align-items:center; gap:8px; }
.grow { flex:1; min-width:0; }
.label { font-size:13.5px; color:var(--muted); margin:2px 0 6px; font-weight:bold; }
.sub { font-size:13px; color:var(--muted); }
.note { font-size:13px; color:var(--muted); line-height:1.5; }
.chips { display:flex; flex-wrap:wrap; gap:7px; }
.chips.scroll { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; scrollbar-width:none; }
.chips.scroll::-webkit-scrollbar { display:none; }
.chip { border:1.5px solid var(--line); background:#fff; border-radius:18px; padding:7px 14px; font-size:16px; white-space:nowrap; flex:none; }
.chip.on { background:var(--teal); border-color:var(--teal); color:#fff; font-weight:bold; }
.chip.small { padding:5px 11px; font-size:14.5px; }
.chip.add { background:var(--todo); border-color:var(--todo); color:#fff; font-weight:bold; }
.big { display:block; width:100%; border:0; border-radius:14px; background:var(--grad); color:#fff; font-size:18px; font-weight:bold; padding:14px; margin:4px 0 10px; }
.big:disabled { background:#cbd5dc; }
.ghost { display:block; width:100%; border:2px solid var(--navy); background:#fff; color:var(--navy); border-radius:12px; font-size:16.5px; font-weight:bold; padding:11px; margin-bottom:10px; }
.ghost.red { border-color:var(--red); color:var(--red); }
.ghost.dim { border-color:var(--line); color:var(--muted); font-weight:normal; }
.pill { border:0; border-radius:14px; background:var(--grad); color:#fff; font-size:13.5px; font-weight:bold; padding:5px 11px; white-space:nowrap; margin-left:6px; }
.pill:disabled { opacity:.45; }
input[type=text], input[type=date], input[type=time], textarea { width:100%; font-size:17px; padding:10px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; background:#fff; color:var(--ink); -webkit-appearance:none; appearance:none; }
input[type=date], input[type=time] { min-height:46px; }
textarea { min-height:76px; resize:vertical; }
.err { background:var(--warn); color:#fff; border-radius:12px; padding:10px 12px; margin-bottom:10px; line-height:1.45; }
.box { background:#fff6ec; border:2px solid var(--orange); border-radius:12px; padding:10px 12px; margin-bottom:10px; line-height:1.5; }
.div { height:1px; background:#EAF0F4; }
.link { background:none; border:0; color:var(--navy); font-weight:bold; font-size:16px; padding:6px 0; }
.link.red { color:var(--red); font-weight:normal; font-size:14.5px; }
.badge { display:inline-block; background:var(--red); color:#fff; font-size:11px; font-weight:bold; border-radius:9px; padding:0 6px; margin-left:6px; line-height:17px; vertical-align:middle; }
.newtag { display:inline-block; background:var(--red); color:#fff; font-size:10.5px; font-weight:bold; border-radius:5px; padding:0 5px; margin-left:6px; flex:none; }
.tag { display:inline-block; color:#fff; font-size:11.5px; font-weight:bold; border-radius:5px; padding:1px 6px; flex:none; }
.scard { overflow-y:auto; -webkit-overflow-scrolling:touch; margin-top:4px; }
.chev { display:inline-block; width:26px; height:26px; border-radius:13px; background:var(--tealsoft); color:var(--teal); text-align:center; line-height:26px; font-size:12px; font-weight:bold; flex:none; }
/* 首頁上面 */
.hero { background:var(--grad); color:#fff; border-radius:0 0 26px 26px; position:relative; overflow:hidden; padding:16px 18px 18px; padding-top:calc(16px + env(safe-area-inset-top)); }
.hero:before { content:''; position:absolute; width:72vw; height:72vw; max-width:420px; max-height:420px; border-radius:50%; background:rgba(255,255,255,.10); right:-26vw; top:-34vw; }
.hero:after { content:''; position:absolute; width:40vw; height:40vw; max-width:240px; max-height:240px; border-radius:50%; background:rgba(255,255,255,.07); left:-18vw; bottom:-22vw; }
.hero-in { max-width:680px; margin:0 auto; position:relative; z-index:1; }
.wx { background:rgba(255,255,255,.18); border-radius:16px; padding:8px 12px; text-align:center; border:0; color:#fff; flex:none; margin-left:10px; }
.hint { background:rgba(255,255,255,.18); border-radius:10px; padding:5px 10px; font-size:13.5px; display:inline-block; margin-top:10px; border:0; color:#fff; text-align:left; }
.wxbar { background:rgba(0,0,0,.15); border-radius:12px; padding:8px 10px; font-size:14px; line-height:1.45; margin-top:12px; }
/* 我的工地 */
.sitebox { border:1.5px solid var(--line); border-radius:12px; padding:8px 12px; background:#fff; text-align:left; width:100%; display:block; }
.siteopt { border:0; border-bottom:1px solid #EAF0F4; background:none; padding:10px 4px; text-align:left; width:100%; display:block; }
.enter { border:0; border-radius:14px; background:var(--grad); color:#fff; font-size:16px; font-weight:bold; padding:14px; white-space:nowrap; flex:none; }
.bar { height:6px; border-radius:4px; background:var(--bluesoft); margin-top:4px; overflow:hidden; }
.bar > i { display:block; height:100%; background:var(--grad); border-radius:4px; }
.rem { padding:7px 0; font-size:14.5px; line-height:1.4; }
.rem.hot { color:var(--warn); font-weight:bold; }
.tabs { display:flex; gap:6px; }
.tab { flex:1; border:0; border-radius:12px; background:var(--soft); padding:8px 4px; font-size:15px; font-weight:bold; }
.tab.on { background:var(--teal); color:#fff; }
.tbox { width:22px; height:22px; border-radius:5px; border:2px solid #5D7486; background:#fff; color:#fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; padding:0; }
.tbox.done { background:#9AA8B4; border-color:#9AA8B4; }
.trow { display:flex; align-items:flex-start; gap:6px; padding:4px 0; }
.trow .t { font-size:15px; line-height:1.35; padding-top:2px; word-break:break-word; }
.trow.done .t { color:#98A2B3; text-decoration:line-through; }
.who { font-size:12.5px; color:var(--todo); font-weight:bold; display:block; }
.news { display:flex; gap:10px; padding:8px 0; align-items:flex-start; }
.ico { width:34px; height:34px; border-radius:17px; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
.nsub { font-size:13px; color:#9A3412; background:#FFF6EC; border-radius:6px; padding:1px 6px; margin-top:2px; display:inline-block; }
.days { display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-top:8px; }
.day { min-width:74px; border-radius:12px; background:#F4F8F9; padding:8px 4px; text-align:center; flex:none; }
.day.rain { background:#E6F0FB; }
/* 工地頁、清單 */
.tile { display:flex; align-items:center; gap:14px; width:100%; background:#fff; border:0; border-radius:18px; padding:13px 14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(24,59,86,.12); text-align:left; }
.tile .em { width:50px; height:50px; border-radius:25px; display:flex; align-items:center; justify-content:center; font-size:24px; flex:none; }
.tile b { font-size:19px; display:block; }
.arrow { color:var(--line); font-size:26px; flex:none; }
.item { background:#fff; border-radius:12px; padding:10px 12px; margin-bottom:9px; box-shadow:0 1px 2px rgba(24,59,86,.10); display:flex; align-items:center; gap:10px; width:100%; border:0; text-align:left; font-size:16px; }
.pdfph { width:60px; height:46px; border:1.5px solid #9AA3B0; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); flex:none; background:#fff; }
.key { flex:1; border:2px solid var(--navy); background:#fff; color:var(--navy); border-radius:10px; padding:9px; font-size:16px; font-weight:bold; }
.key.on { background:var(--navy); color:#fff; }
/* 我的工作 */
.entry { border:1.5px solid var(--line); border-radius:10px; padding:9px 10px; margin:6px 0; display:flex; gap:8px; align-items:center; background:#fafcfd; }
.entry.mine { border-color:var(--orange); background:#fff8ef; }
.entry .who2 { font-weight:bold; color:var(--navy); min-width:2.2em; }
.entry .body { flex:1; min-width:0; }
.thumbs { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:8px; }
.thumb { position:relative; padding-top:75%; background:#d5dde3; border-radius:8px; overflow:hidden; }
.thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.thumb .x { position:absolute; top:3px; right:3px; background:rgba(0,0,0,.6); color:#fff; border:0; border-radius:10px; padding:1px 8px; font-weight:bold; }
.thumb .new { position:absolute; left:3px; bottom:3px; background:var(--orange); color:#fff; font-size:11px; border-radius:6px; padding:0 5px; }
.row2 { display:flex; gap:8px; }
.row2 > * { flex:1; min-width:0; }
.mat { display:flex; gap:6px; margin-bottom:6px; }
.mat input { padding:8px; }
.full img { width:100%; border-radius:10px; display:block; margin-bottom:8px; background:#d5dde3; min-height:120px; }
.hd { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
/* 日誌照片 */
.pgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.pgrid .ph { position:relative; padding-top:75%; border-radius:8px; overflow:hidden; background:#DDE5EA; }
.pgrid .ph img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
/* 月曆 */
.mgrid { display:grid; grid-template-columns:repeat(7, 1fr); text-align:center; }
.mgrid .h { font-size:12.5px; color:var(--muted); padding:4px 0; }
.mcell { height:46px; display:flex; align-items:center; justify-content:center; }
.mcell button { width:40px; height:42px; border:0; border-radius:11px; background:none; font-size:15.5px; padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.mcell button.today { background:var(--tealsoft); font-weight:800; }
.mcell button.sel { background:var(--blue); color:#fff; font-weight:800; }
.dots { height:6px; display:flex; gap:2px; justify-content:center; margin-top:2px; }
.dots i { width:5px; height:5px; border-radius:3px; background:var(--orange); display:block; }
.sel .dots i { background:#fff; }
.ev { display:flex; gap:8px; padding:9px 0; border:0; border-top:1px solid #EAF0F4; width:100%; background:none; text-align:left; font-size:16px; }
.sitechip { font-size:12px; color:#0F766E; background:var(--tealsoft); border-radius:6px; padding:1px 6px; font-weight:bold; margin-left:6px; }
.stepper { display:flex; align-items:center; background:#F1F7F8; border-radius:10px; margin-top:8px; }
.stepper > button { border:0; background:none; font-size:28px; color:var(--teal); padding:2px 14px; }
.stepper > button:disabled { color:var(--line); }
.stepper .mid { flex:1; text-align:center; color:var(--ink); }
/* PDF */
#pdfpages canvas { display:block; width:100%; height:auto; background:#fff; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.2); }
/* 電腦也能用（使用者 2026-11-10「我想要電腦也能打開的」「排法要舒適，不要那麼擠（手機才需要）」「電腦就是方便人員查看操控」）：
   手機照舊一欄；電腦整頁放大（--z：一般 1.05、24／27 吋 1.2、29 吋 21:9 與 40 吋長條 1.3）、間距拉開，
   首頁兩欄（長條螢幕三欄），卡片跟著螢幕高度拉長；清單、表單那幾頁窄一點比較好讀 */
:root { --z:1; }
.hub { display:flex; flex-direction:column; }
.pc-only { display:none; }
@media (min-width: 900px) {
  :root { --z:1.05; }
  #app, .sheet { zoom:var(--z); }
  .sheet { max-height:calc(88vh / var(--z)); max-width:600px; }
  .wrap { max-width:1240px; padding:22px 26px 56px; }
  .wrap.narrow, .r-login .wrap, .r-work .wrap, .r-edit .wrap, .r-view .wrap, .r-todo .wrap, .r-pours .wrap, .r-sheets .wrap, .r-contracts .wrap { max-width:820px; }
  .r-calendar .wrap { max-width:1240px; }
  .hero { padding:22px 26px 24px; }
  .hero-in { max-width:1188px; }
  .card { padding:18px 20px; margin-bottom:18px; border-radius:18px; }
  .hubcols { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.2fr); column-gap:26px; align-items:start; }
  .hubcols.c3 { grid-template-columns:repeat(3, minmax(0, 1fr)); }
  .rem { padding:10px 0; }
  .news { padding:11px 0; }
  .trow { padding:6px 0; }
  .a-rem .scard { height:330px !important; }
  .a-week .scard { height:230px !important; }
  .a-news .scard { height:max(440px, calc(100vh / var(--z) - 330px)) !important; }
  .hub.has-week .a-news .scard { height:max(360px, calc(100vh / var(--z) - 640px)) !important; }
  .chips.scroll { flex-wrap:wrap; overflow:visible; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; column-gap:18px; }
  .tile { padding:18px 20px; margin-bottom:18px; }
  .item { padding:14px 16px; margin-bottom:12px; }
  .pgrid { grid-template-columns:repeat(3, 1fr); gap:16px; }
  .thumbs { grid-template-columns:repeat(4, 1fr); }
  .logcards { column-count:2; column-gap:20px; }
  .logcards > .card { break-inside:avoid; }
  .calgrid { display:grid; grid-template-columns:minmax(0, 1.1fr) minmax(0, 1fr); column-gap:26px; align-items:start; }
  .mcell { height:60px; }
  .mcell button { width:54px; height:54px; }
  .phone-only { display:none; }
  .pc-only { display:block; }
  #pdfpages { max-width:1400px; margin:0 auto; }
  button, [data-act] { cursor:pointer; }
  .tile:hover, .item:hover, .news:hover, .ev:hover, .siteopt:hover, .rem[data-act]:hover { filter:brightness(.96); }
}
/* 24／27 吋：放大 1.2、還是兩欄（寬一點） */
@media (min-width: 1600px) {
  :root { --z:1.2; }
  .wrap { max-width:1440px; }
  .hero-in { max-width:1388px; }
  .r-calendar .wrap { max-width:1300px; }
  .pgrid { grid-template-columns:repeat(4, 1fr); }
}
/* 29 吋 21:9、40 吋長條：放大 1.3、首頁三欄 */
@media (min-width: 2300px) {
  :root { --z:1.3; }
  .wrap { max-width:2000px; }
  .hero-in { max-width:1948px; }
  .hubcols.c3 .a-rem .scard { height:max(320px, calc(100vh / var(--z) - 540px)) !important; }
  .hubcols.c3 .a-week .scard { height:max(260px, calc(100vh / var(--z) - 600px)) !important; }
  .hubcols.c3 .a-news .scard { height:max(440px, calc(100vh / var(--z) - 330px)) !important; }
  .tiles { grid-template-columns:repeat(3, 1fr); }
  .pgrid { grid-template-columns:repeat(5, 1fr); }
  #pdfpages { max-width:1900px; display:grid; grid-template-columns:1fr 1fr; column-gap:16px; }
}
/* 跳出的視窗 */
.mask { position:fixed; inset:0; background:rgba(10,30,45,.45); z-index:50; display:flex; align-items:center; justify-content:center; padding:14px; }
.sheet { background:#fff; border-radius:20px; width:100%; max-width:540px; max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px 16px 10px; }
.sheet h3 { margin:0 0 10px; font-size:19px; }
.btns { display:flex; justify-content:flex-end; gap:6px; margin-top:12px; position:sticky; bottom:-10px; background:#fff; padding:4px 0 6px; }
.btns button { border:0; background:none; font-size:16.5px; padding:9px 12px; color:var(--navy); font-weight:bold; border-radius:10px; }
.btns button:disabled { color:#b5c0c8; }
.btns .dim { color:var(--muted); font-weight:normal; }
.btns .redb { color:var(--red); }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="pick" accept="image/*" multiple style="display:none">
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbyAF82NyYZZ81ISJ_r7_jPRP0rWNA4kLraB9uMkd2FuZwbnkOJ9SzuM9HaA-oymdXpQ/exec';

var S = {

  return '<button class="chip' + (on ? ' on' : '') + (small ? ' small' : '') + '" data-act="' + act + '" data-v="' + esc(v) + '">' + esc(label) + '</button>';
}
function topBar(title, back, right, rightAct) {
  return '<div class="top">' + (back ? '<button class="back" data-act="nav" data-v="' + back + '">‹</button>' : '') + '<h1>' + esc(title) + '</h1>' +
    (right ? '<button data-act="' + (rightAct || '') + '">' + esc(right) + '</button>' : '') + '</div>';
}
function badgeHtml(n) { return n > 0 ? '<span class="badge">' + (n > 99 ? '99+' : n) + '</span>' : ''; }

function render() {
  // 卡片裡面捲到哪裡：重畫後放回去
  var keep = {}, els = document.querySelectorAll('[data-sk]');
  for (var i = 0; i < els.length; i++) keep[els[i].getAttribute('data-sk')] = els[i].scrollTop;
  var h;
  if (S.route === 'login') h = renderLogin();
  else if (!S.s || !S.s.today) h = topBar('柏捷工地', null) + '<div class="wrap">' + (S.err ? '<div class="err">' + esc(S.err) + '</div>' : '<div class="card note" style="font-size:15px">讀取中…</div>') +
    '<button class="ghost dim" data-act="tologin" style="margin-top:14px">回登入畫面</button></div>';
  else h = ({ hub: renderHub, work: renderWork, edit: renderEdit, view: renderView, site: renderSite, pours: renderPours, sheets: renderSheets,
    pdf: renderPdf, contracts: renderContracts, todo: renderTodo, logs: renderLogs, calendar: renderCal }[S.route] || renderHub)();
  $('app').innerHTML = h;
  $('app').className = 'r-' + S.route;   // 電腦版：清單、表單那幾頁窄一點比較好讀
  if (S.route === 'login') { var c = $('code'); if (c) c.value = S.codeInput; }
  for (var k in keep) { var el = document.querySelector('[data-sk="' + k + '"]'); if (el) el.scrollTop = keep[k]; }
  fillPhotos();
}
/** 背景回來的資料：正在打字、在看 PDF 時先不重畫（不然鍵盤會收起來、PDF 會不見） */
function renderSoft() {
  if (S.route === 'pdf') return;
  var a = document.activeElement;
  if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'file'))) return;
  render();
}
function renderModal() {
  var m = S.modal;
  if (!m) { $('modal').innerHTML = ''; return; }
  var body = { notice: noticeModal, nview: nviewModal, todoadd: todoAddModal, todoedit: todoEditModal, cal: calModal, dates: datesModal }[m.type](m);
  $('modal').innerHTML = '<div class="mask" data-act="maskclose"><div class="sheet">' + body + '</div></div>';
  fillPhotos();
}
function closeModal() { S.modal = null; renderModal(); }

/** 電腦：寬度 900 以上首頁兩欄；2300 以上（29 吋 21:9、40 吋長條）三欄（使用者「排法要舒適不要那麼擠」：不再排四欄） */
function mq(px) { return !!(window.matchMedia && window.matchMedia('(min-width: ' + px + 'px)').matches); }
function wide() { return mq(900); }
function hubCols() { return mq(2300) ? 3 : mq(900) ? 2 : 1; }
var COLS_NOW = null;
window.addEventListener('resize', function () { var c = hubCols(); if (COLS_NOW !== null && c !== COLS_NOW && S.route === 'hub') renderSoft(); COLS_NOW = c; });
function standalone() { return !!(window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)); }

function renderLogin() {
  var h = topBar('柏捷工地App') + '<div class="wrap narrow">';
  if (S.locked) {
    return h + '<div class="card"><h2 style="margin:4px 0 10px;font-size:22px">🔒 這支手機鎖住了</h2><div class="err">' + esc(S.locked) + '</div>' +
      '<button class="ghost" data-act="retry">' + (S.busy ? '確認中…' : '再試一次') + '</button></div></div>';
  }
  h += '<div class="card"><h2 style="margin:4px 0 10px;font-size:22px">用代碼登入</h2>';
  if (S.saved) {
    // 代碼記住了：鎖住、不顯示、不能改，只按「登入」（使用者 2026-11-08）
    h += '<div class="label">這支手機的代碼（已記住，不能改）</div>' +
      '<div style="font-size:28px;letter-spacing:8px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#f4f7f8;color:var(--muted)">🔒 ●●●●●●</div>';
  } else {
    h += '<div class="label">輸入管理者給你的代碼</div>' +
      '<input type="text" id="code" data-f="codeInput" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="12" style="font-size:26px;letter-spacing:5px;text-transform:uppercase">';
  }
  h += (S.err ? '<div class="err" style="margin-top:10px">' + esc(S.err) + '</div>' : '') +
    '<button class="big" data-act="login" style="margin-top:12px"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '登入中…' : '登入') + '</button>';
  h += S.saved ? '<div class="note">要換人或換代碼，請找管理者。</div>' : '<div class="note">代碼只給你自己用；打錯 3 次這支手機會先鎖 30 分鐘。</div>';
  h += '</div>';
  if (!standalone()) h += '<div class="box phone-only"><b>iPhone 請先「加入主畫面」再登入</b><div>用 Safari 打開這個網頁 → 按下面的「分享」⬆︎ →「加入主畫面」→ 之後都從桌面的「柏捷工地」圖示打開，在那裡輸入代碼（Safari 裡輸入的，圖示那邊不會記得）。</div></div>';
  // 電腦版程式（安裝檔，網址後面帶 ?app=pc；使用者 2026-11-10「電腦的部分我想做成安裝檔，不想給他們連結」）：不提網址
  if (PCAPP) h += '<div class="box pc-only" style="border-color:var(--teal);background:#E9F7F6"><b>柏捷工地 電腦版</b><div>第一次輸入自己的代碼（找管理者拿），之後會記在這台電腦的「柏捷工地」程式裡。</div></div>';
  else h += '<div class="box pc-only" style="border-color:var(--teal);background:#E9F7F6"><b>電腦也可以用</b><div>直接用這個網址打開就好；代碼會記在這台電腦的這個瀏覽器（換瀏覽器、清除瀏覽紀錄要重打）。可以把這頁加到書籤。</div></div>';
  return h + '<div class="sub" style="text-align:center">網頁版 ' + WEB_VERSION + '</div></div>';
}

// ===================== 首頁 =====================
function renderHub() {
  var s = S.s, f = S.feed, off = isOffice(), sites = feedSites(), news = shownNews();
  var week = off && f && f.cal;
  // 手機一欄（照這個順序）；電腦兩欄，左右各自往下排（左：工地、提醒、天氣；右：這週行程、最新消息）
  var todos = off ? homeTodos() : null;
  var cSite = '<div class="a-site">' + siteCard(sites, news) + '</div>';
  var cRem = '<div class="a-rem">' + (todos ? remTodoCard(todos) : scrollCard('⏰ 今日提醒', 168, remRows(), '', null, 'rem')) + '</div>';
  var cWeek = week ? '<div class="a-week">' + weekCalCard(f.cal) + '</div>' : '';
  var cNews = '<div class="a-news">' + newsCard(news) + '</div>';
  var cWx = S.fc && S.fc.days && S.fc.days.length ? '<div class="a-wx">' + weekWeather(S.fc) + '</div>' : '';
  var h = renderHero() + '<div class="wrap hub' + (week ? ' has-week' : '') + '">';
  var n = hubCols();
  if (n === 1) h += cSite + cRem + cWeek + cNews + cWx;
  else if (n === 2) h += '<div class="hubcols"><div>' + cSite + cRem + cWx + '</div><div>' + cWeek + cNews + '</div></div>';
  else if (week) h += '<div class="hubcols c3"><div>' + cSite + cRem + '</div><div>' + cWeek + cWx + '</div><div>' + cNews + '</div></div>';
  else h += '<div class="hubcols c3"><div>' + cSite + cWx + '</div><div>' + cRem + '</div><div>' + cNews + '</div></div>';   // 施工人員沒有這週行程
  var sub = S.feedErr || (!f && !S.feedBusy ? '讀不到最新消息：網路好了按上面「⟳ 更新」' : '');
  h += '<div class="a-foot"><div class="card"><button class="big" style="margin:0" data-act="sync">' + (S.feedBusy ? '更新中…' : '⟳ 更新') + '</button>' +
    (sub ? '<div class="sub" style="margin-top:6px">' + esc(sub) + '</div>' : '') + '</div>';
  h += '<div class="sub" style="padding-left:4px">' + esc(s.name + (s.full ? '（' + s.full + '）' : '') + '・' + s.role) + '　' + (PCAPP ? '電腦版' : '網頁版') + ' ' + WEB_VERSION + '</div>';
  h += '<div class="note" style="padding:4px 4px 0">網頁版沒有桌面小工具，關著時也不會跳通知；打開就會更新。</div></div>';
  return h + '</div>';
}

function renderHero() {
  var w = S.here, now = new Date();
  var h = '<div class="hero"><div class="hero-in"><div class="row" style="gap:0">' +
    '<div class="grow"><div style="font-size:15px;font-weight:bold;opacity:.88;letter-spacing:1px">柏捷營造</div>' +
    '<div style="font-size:28px;font-weight:800;line-height:34px;margin-top:2px">' + hello(now) + ' 👷</div></div>';
  if (w) h += '<button class="wx" data-act="here"><div style="font-size:26px;font-weight:800;white-space:nowrap">' + nightEmoji(weatherEmoji(w.weather || w.text), now) +
    (hasTemp(w) ? ' ' + Math.round(w.temp) + '°' : '') + '</div><div style="font-size:13px;font-weight:bold">' + esc(w.text || w.weather) + '</div>' +
    '<div style="font-size:11.5px;opacity:.85">' + esc(w.town || w.county) + '</div></button>';
  h += '</div><div style="font-size:17px;font-weight:bold;line-height:23px;margin-top:6px">' + esc(warmGreeting(now)) + '</div>';
  var g = weatherGreeting(w, now);
  if (g) h += '<div class="wxbar">' + esc(g) + '</div>';
  else if (!w && S.hereHint) h += '<button class="hint" data-act="here">' + esc(S.hereHint) + '</button>';
  return h + '</div></div>';
}

function siteCard(sites, news) {
  var cur = null;
  sites.forEach(function (x) { if (x.name === S.site) cur = x; });
  if (!cur) cur = sites[0] || null;
  function badge(n) { var c = 0; news.forEach(function (x) { if (x.site === n && x.isNew) c++; }); return c; }
  var others = 0; sites.forEach(function (x) { if (!cur || x.name !== cur.name) others += badge(x.name); });
  var h = '<div class="card"><div class="row"><span class="label" style="margin:0">我的工地</span>' +
    (others ? '<span style="font-size:12.5px;color:var(--red);font-weight:bold">其他工地有 ' + others + ' 則新的</span>' : '') + '</div>';
  h += '<div class="row" style="margin-top:6px"><button class="sitebox grow" data-act="siteopen"><div class="row" style="gap:4px">' +
    '<span style="font-size:21px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(cur ? cur.name : '還沒有工地') + '</span>' +
    (cur ? badgeHtml(badge(cur.name)) : '') + '<span class="grow"></span><span class="chev">' + (S.siteOpen ? '▲' : '▼') + '</span></div>' + (cur ? progressHtml(cur) : '') + '</button>';
  if (cur) h += '<button class="enter" data-act="enter" data-v="' + esc(cur.name) + '">進入 ›</button>';
  h += '</div>';
  if (S.siteOpen) {
    h += '<div style="margin-top:8px;border-top:1px solid #EAF0F4">';
    sites.forEach(function (x) {
      h += '<button class="siteopt" data-act="enter" data-v="' + esc(x.name) + '"><div style="font-size:18px;font-weight:bold">' + esc(x.name) + badgeHtml(badge(x.name)) + '</div>' + progressHtml(x) + '</button>';
    });
    h += '</div>';
  }
  return h + '</div>';
}
function progressHtml(st) {
  var t = siteDaysText(st), p = siteProgress(st);
  return (t ? '<div class="sub" style="font-size:12.5px">' + esc(t) + '</div>' : '') + (p != null ? '<div class="bar"><i style="width:' + Math.max(2, Math.round(p * 100)) + '%"></i></div>' : '');
}

function scrollCard(title, height, body, right, action, key, top) {
  return '<div class="card"><div class="row" style="gap:0"><span class="ttl grow">' + esc(title) + '</span>' +
    (right ? '<span style="font-size:12.5px;color:var(--red);font-weight:bold">' + esc(right) + '</span>' : '') +
    (action ? '<button class="pill" data-act="' + action.act + '" data-v="' + esc(action.v || '') + '">' + esc(action.label) + '</button>' : '') + '</div>' +
    (top || '') + '<div class="scard" data-sk="' + key + '" style="height:' + height + 'px">' + body + '</div></div>';
}

function remRows() {
  var list = (S.feed && S.feed.reminders) || [];
  if (!S.feed) return '<div class="sub" style="padding:6px 0;font-size:14px">' + (S.feedBusy ? '讀取中…' : '讀不到：網路好了按下面「⟳ 更新」') + '</div>';
  if (!list.length) return '<div class="sub" style="padding:6px 0;font-size:14px">今天沒有要特別注意的事 👍</div>';
  return list.map(function (r, i) {
    var click = r.site || r.kind === 'cal';
    return (i ? '<div class="div"></div>' : '') + '<div class="rem' + (r.hot ? ' hot' : '') + '"' + (click ? ' data-act="rem" data-v="' + i + '"' : '') + '>' + esc(r.text) + '</div>';
  }).join('');
}

/** 今日提醒｜待辦（開發者、老闆、主任、公司） */
function remTodoCard(all) {
  var open = all.filter(function (t) { return !t.done; }), bySite = {}, order = [];
  open.forEach(function (t) { if (!bySite[t.site]) { bySite[t.site] = []; order.push(t.site); } bySite[t.site].push(t); });
  order.sort(function (a, b) { return bySite[b].length - bySite[a].length || cmp(a, b); });
  if (S.todoSite && !bySite[S.todoSite]) S.todoSite = '';
  var n = ((S.feed && S.feed.reminders) || []).length;
  var h = '<div class="card"><div class="tabs"><button class="tab' + (S.hubTab === 0 ? ' on' : '') + '" data-act="hubtab" data-v="0">⏰ 今日提醒 ' + n + '</button>' +
    '<button class="tab' + (S.hubTab === 1 ? ' on' : '') + '" data-act="hubtab" data-v="1">✅ 待辦 ' + open.length + '</button></div>';
  if (S.hubTab !== 1) return h + '<div class="scard" data-sk="rem" style="height:232px">' + remRows() + '</div></div>';
  h += '<div class="chips scroll" style="margin-top:8px"><button class="chip small add" data-act="todoadd">＋ 新增</button>' + chip('todosite', '', '全部 ' + open.length, !S.todoSite, true) +
    order.map(function (s) { return chip('todosite', s, s + ' ' + bySite[s].length, S.todoSite === s, true); }).join('') + '</div>';
  var body = open.length ? '' : '<div class="sub" style="padding:6px 0;font-size:14px">都做完了 👍　按「＋ 新增」加待辦</div>';
  (S.todoSite ? [S.todoSite] : order).forEach(function (s) {
    var list = bySite[s]; if (!list) return;
    body += '<div class="row" style="padding:8px 0 2px" data-act="todoopen" data-v="' + esc(s) + '"><b class="grow" style="font-size:14px;color:var(--navy)">' + esc(s) + '</b>' +
      '<span style="font-size:13px;color:var(--todo);font-weight:bold">' + list.length + ' 項 ›</span></div>';
    list.slice().sort(function (a, b) { return a.at - b.at; }).forEach(function (t) { body += hubTodoRow(t); });
  });
  var done = all.filter(function (t) { return t.done && (!S.todoSite || t.site === S.todoSite); }).sort(function (a, b) { return b.doneAt - a.doneAt; });
  if (done.length) { body += '<div style="font-size:13px;font-weight:bold;color:var(--muted);padding-top:10px">最近做完</div>'; done.forEach(function (t) { body += hubTodoRow(t); }); }
  return h + '<div class="scard" data-sk="todo" style="height:196px">' + body + '</div></div>';
}
function hubTodoRow(t) {
  return '<div class="trow' + (t.done ? ' done' : '') + '"><button class="tbox' + (t.done ? ' done' : '') + '" style="margin:3px 4px 0 2px" data-act="todotoggle" data-v="' + esc(t.id) + '">' + (t.done ? '✓' : '') + '</button>' +
    '<div class="grow" data-act="todoopen" data-v="' + esc(t.site) + '"><div class="t">' + esc(t.text) + '</div>' +
    (t.done ? '<span class="who">（' + esc(t.site) + '）— ' + esc(t.doneBy || '有人') + ' 完成</span>' : '') + '</div></div>';
}

/** 📅 這週行程：今天起 8 天，一天一段 */
function weekCalCard(events) {
  var t = todayYmd(), body = '', any = false;
  for (var i = 0; i <= 7; i++) {
    var d = addDays(t, i), list = eventsOn(events, d);
    if (!list.length) continue;
    body += (any ? '<div class="div"></div>' : '') + '<div class="row" style="align-items:flex-start;padding:6px 0" data-act="calopen" data-v="' + d + '">' +
      '<div style="width:78px;flex:none;font-size:13.5px;font-weight:bold;color:' + (i === 0 ? 'var(--teal)' : 'var(--muted)') + '">' + (i === 0 ? '今天' : i === 1 ? '明天' : calDay(d)) + '</div><div class="grow">' +
      list.map(function (e) { return '<div style="font-size:14.5px;line-height:20px">' + esc(e.title + (e.site ? '（' + e.site + '）' : '') + (e.allDay || !e.start ? '' : '（' + ampm(e.start) + '）')) + '</div>'; }).join('') + '</div></div>';
    any = true;
  }
  if (!any) body = '<div class="sub" style="padding:6px 0;font-size:14px">這週沒有行程。按右上「打開」可以新增。</div>';
  return scrollCard('📅 這週行程', 176, body, '', { label: '打開 ›', act: 'calopen', v: '' }, 'week');
}

// 順序（使用者 2026-11-10「注意灌漿代辦發包，這樣排列」）：全部、注意事項、灌漿・施工單、待辦、發包；施工人員放最後（跟 App 一樣）
var NEWS_GROUPS = [['全部', []], ['📢 注意事項', ['notice']], ['🚚 灌漿・施工單', ['pour', 'sheet']], ['✅ 待辦', ['todo']], ['🤝 發包', ['contract']], ['👷 施工人員', ['worker']]];
var NEWS_ICON = { pour: ['🚚', '#F2994A'], sheet: ['📐', '#16A6A0'], contract: ['🤝', '#9B51E0'], worker: ['👷', '#2F80ED'], notice: ['📢', '#E5383B'], cal: ['📅', '#2F80ED'], todo: ['✅', '#1E8E5A'] };
function newsTag(n) {
  switch (n.kind) {
    case 'cal': return n.tag === 'add' ? ['新增行程', '#1E9E6A'] : n.tag === 'del' ? ['行程取消', '#E5383B'] : n.tag === 'chg' ? ['行程改了', '#2F80ED'] : ['行程', '#2F80ED'];
    case 'worker': return ['施工人員', '#1C5D99'];
    case 'pour': return ['灌漿數量', '#F2994A'];
    case 'sheet': return ['施工單', '#16A6A0'];
    case 'contract': return ['發包', '#9B51E0'];
    case 'notice': return ['注意事項', '#E0662B'];
    case 'todo': return [n.tag === 'done' ? '待辦完成' : '新增待辦', '#1E8E5A'];
    default: return ['消息', '#5D7486'];
  }
}
function hexA(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
function newsCard(news) {
  var groups = NEWS_GROUPS.filter(function (g) { return g[0] === '全部' || news.some(function (n) { return g[1].indexOf(n.kind) >= 0; }); });
  var cur = groups.filter(function (g) { return g[0] === S.newsGroup; })[0] || groups[0];
  var list = cur[1].length ? news.filter(function (n) { return cur[1].indexOf(n.kind) >= 0; }) : news;
  var chips = groups.length > 2;
  var top = chips ? '<div class="chips scroll" style="margin-top:6px">' + groups.map(function (g) { return chip('newsgroup', g[0], g[0], g[0] === cur[0], true); }).join('') + '</div>' : '';
  var newN = news.filter(function (n) { return n.isNew; }).length;
  var body = list.length ? list.map(function (n, i) { return (i ? '<div class="div"></div>' : '') + newsRow(n); }).join('')
    : '<div class="sub" style="padding:6px 0;font-size:14px">' + (!S.feed ? (S.feedBusy ? '讀取中…' : '讀不到：網路好了按下面「⟳ 更新」') : news.length ? '這一類最近沒有消息' : '最近 14 天沒有新消息') + '</div>';
  return scrollCard('📣 最新消息', chips ? 254 : 300, body, newN ? '新的 ' + newN + ' 則' : '', { label: '＋ 注意事項', act: 'noticeadd' }, 'news', top);
}
function newsRow(n) {
  var ic = NEWS_ICON[n.kind] || ['📱', '#1C5D99'], tg = newsTag(n), meta = [n.by, timeWord(n.at)].filter(Boolean).join(' ・ ');
  return '<div class="news" data-act="news" data-v="' + esc(n.key) + '"><div class="ico" style="background:' + hexA(ic[1], 0.16) + '">' + ic[0] + '</div><div class="grow">' +
    '<div class="row" style="gap:0"><span class="tag" style="background:' + tg[1] + '">' + tg[0] + '</span>' +
    (n.site ? '<span style="font-size:12.5px;color:var(--muted);font-weight:bold;margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(n.site) + '</span>' : '') +
    (n.isNew ? '<span class="newtag">新</span>' : '') + '</div>' +

function pourOf(d) { return d.props || {}; }
/** 灌漿數量排序：今天和之後的（最近的在最上面）→ 已經過的（新的在上面）→ 沒寫日期的 */
function pourOrder(list) {
  var t = todayYmd();
  var dated = list.filter(function (d) { return dateOf(pourOf(d).pourDate); }), none = list.filter(function (d) { return !dateOf(pourOf(d).pourDate); });
  var next = dated.filter(function (d) { return pourOf(d).pourDate >= t; }).sort(function (a, b) { return cmp(pourOf(a).pourDate, pourOf(b).pourDate); });
  var past = dated.filter(function (d) { return pourOf(d).pourDate < t; }).sort(function (a, b) { return cmp(pourOf(b).pourDate, pourOf(a).pourDate); });
  return next.concat(past, none.sort(function (a, b) { return cmp(b.modified || '', a.modified || ''); }));
}
function docTitle(d) { return String(d.name || '').replace(/\.pdf$/i, ''); }
function contractBook(items) {
  var live = (items || []).filter(function (c) { return !c.deleted; }).sort(function (a, b) { return ((a.order || 0) - (b.order || 0)) || cmp(a.name || '', b.name || ''); });
  return { todo: live.filter(function (c) { return !c.done; }),
    done: live.filter(function (c) { return c.done; }).sort(function (a, b) { return cmp(b.date || '', a.date || '') || ((a.order || 0) - (b.order || 0)); }) };
}
function money(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function logItem(log, c) {

  var people = Number(x.people) || 0, hours = x.hours || '1';

    var t = String(l.text || '').trim(); if (!t) return '';
    return (i + 1) + '.' + t + (l.workers && l.workers.length ? '(' + l.workers.join('+') + ')' : '');
  }).filter(Boolean);
  if (!(people > 0) && !lines.length) return null;
  return { vendor: x.vendor != null ? x.vendor : '柏捷', unit: x.unit != null ? x.unit : '工', qty: people > 0 ? people + '*' + hours : '', lines: lines };
}
/** 這天的照片：照大項的順序，先開發者日誌的（雲端有編號的），再施工人員傳的；單據放最後 */

    ws.filter(function (e) { return e.category === c; }).forEach(function (e) {

      (e.photos || []).forEach(function (id) { out.push({ id: id, w: 1, cat: c, line: '👷 ' + e.name + (first ? '：' + first : ''), date: roc }); });

/** 拍照、相簿選的 → 縮小成 JPEG（工作照片長邊 1600；注意事項 1000、品質 65，不佔空間） */
function shrink(file, max, q) {
  max = max || 1600; q = q || 0.8;
  return new Promise(function (ok, bad) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var du = c.toDataURL('image/jpeg', q);
      ok({ name: 'web_' + Date.now() + '_' + Math.floor(Math.random() * 1000) + '.jpg', url: du, data: du.split(',')[1] });
    };
    img.onerror = function () { URL.revokeObjectURL(url); bad(new Error('這張照片讀不出來')); };
    img.src = url;
  });
}

  list = list.slice(0, Math.max(0, room));
  Promise.all(list.map(function (f) { return shrink(f).catch(function () { return null; }); })).then(function (ps) {

}

function b64ToBytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }

    sc.onerror = function () { pdfLib = null; bad({ error: '看 PDF 的工具載入失敗（網路有問題，等一下再試）' }); };
    document.head.appendChild(sc);

  var doc = (o.pours || []).concat(o.sheets || []).filter(function (d) { return d.id === id; })[0]; if (!doc) return;
  var from = S.route, my = { doc: doc, from: from, title: (pourOf(doc).part || docTitle(doc)), status: '下載中…' };
  S.pdf = my; go('pdf');

 * 一進「我的工作」或工地頁就在背景讀最新那天＋前幾張照片；看過的日子記 10 分鐘，1 分鐘內的不再問；看一天時先讀前一天。

  renderModal();
}

/** 看一則注意事項 */
function openNotice(n) { markSeen([n.key]); S.modal = { type: 'nview', n: n, ask: false, busy: false, err: '' }; renderModal(); render(); }

var ACT = {
  login: function () {
    var c = S.saved || (S.codeInput || '').trim().toUpperCase(); if (!c || S.busy) return;
    S.code = c; S.err = '';
    // 快一點（使用者 2026-11-10「優化速度」）：記住的代碼＋上次的資料 → 直接進首頁，登入、最新消息在背景同時問；
    // 代碼被換掉、停用（CODE）或鎖住（LOCKED）一樣會被請回登入畫面
    var sess = S.saved ? LS.getJSON('sess') : null;
    if (sess && sess.today && Number(sess.version) >= 7) {
      S.s = sess; S.site = LS.get('site'); pickSite(sess);
      loadSeen(); S.feed = LS.getJSON('feed'); S.here = LS.getJSON('here'); S.fc = LS.getJSON('fc');
      go('hub'); loadFeed(false);
      api('login').then(function (s) { if (S.code !== c) return; S.s = s; LS.setJSON('sess', s); pickSite(s); renderSoft(); })
        .catch(function (e) { if (e && e.error === 'CODE') codeGone(); });
      return;
    }
    S.busy = true; render();
    api('login').then(function (s) {
      S.busy = false; S.s = s; S.saved = c; LS.set('code', c); LS.setJSON('sess', s); S.site = LS.get('site'); pickSite(s);
      if (hasFeed()) {
        loadSeen(); S.feed = LS.getJSON('feed'); S.here = LS.getJSON('here'); S.fc = LS.getJSON('fc');
        go('hub'); loadFeed(false);
      } else openWork(null);
    }).catch(function (e) {
      S.busy = false; S.code = '';
      if (e.error === 'LOCKED') return;
      if (e.error === 'CODE' && S.saved) { codeGone(); return; }
      S.codeInput = ''; S.err = e.error === 'CODE' ? (e.message || '代碼不對，或已經停用，請找管理者') : errText(e); render();
    });
  },
  retry: function () {   // 鎖住的畫面「再試一次」：問收件服務還鎖不鎖（不算打錯）
    if (S.busy) return;
    S.busy = true; render();
    var keep = S.code; S.code = '';
    api('login').then(function () { }, function (e) {
      S.busy = false; S.code = keep;
      if (e.error === 'LOCKED') { render(); return; }
      S.locked = ''; S.err = ''; render();   // 沒鎖了（收件服務回「代碼不對」是因為沒送代碼，不會記成打錯）
    });
  },
  tologin: function () { S.route = 'login'; S.err = ''; render(); },
  nav: function (v) {
    if (v === 'work' || v === 'site' || v === 'hub' || v === 'pours' || v === 'sheets') { if (S.busy) return; go(v); if (v === 'work') refresh(); }
    else go(v);
  },
  // 首頁
  sync: function () { loadFeed(true); },
  here: function () { askGeo(function () { loadFeed(false); }); },
  siteopen: function () { S.siteOpen = !S.siteOpen; render(); },
  enter: function (v) {
    markSeen(shownNews().filter(function (n) { return n.site === v && n.isNew; }).map(function (n) { return n.key; }));
    setSite(v); S.siteOpen = false;
    if (isOffice()) { openOffice('site'); prefetchLog(v, null, true); } else openWork('hub');
  },
  rem: function (v) {
    var r = ((S.feed && S.feed.reminders) || [])[+v]; if (!r) return;
    if (r.kind === 'notice') {
      var key = String(r.key || '').replace(/:[^:]*$/, '');
      var n = ((S.feed && S.feed.news) || []).filter(function (x) { return x.key === key; })[0];
      if (n) { openNotice(n); return; }
    }
    if (r.kind === 'cal' && isOffice()) { openCal(r.date); return; }
    if (r.site) { setSite(r.site); if (isOffice() && r.kind === 'pour') openOffice('pours'); else render(); }
  },
  hubtab: function (v) { S.hubTab = +v; render(); },
  todosite: function (v) { S.todoSite = v; render(); },
  todoadd: function () { S.modal = { type: 'todoadd', site: S.todoSite || S.site, text: '', busy: false, err: '' }; renderModal(); },
  todotoggle: function (id) {
    var t = (homeTodos() || []).filter(function (x) { return x.id === id; })[0]; if (!t) return;
    var d = !t.done; S.localTodo[id] = d; render();
    api('todo', { op: 'check', id: id, done: d }).catch(function () { delete S.localTodo[id]; render(); }).then(function () { loadFeed(false); });
  },
  todoopen: function (v) { setSite(v); openTodo('hub'); },
  calopen: function (v) {
    markSeen(shownNews().filter(function (n) { return n.kind === 'cal' && n.isNew; }).map(function (n) { return n.key; }));
    openCal(v || null);
  },
  newsgroup: function (v) { S.newsGroup = v; render(); },
  noticeadd: function () { S.modal = { type: 'notice', site: S.site || siteNames()[0] || '', day: '', other: false, text: '', photo: null, busy: false, err: '' }; renderModal(); },
  news: function (key) {
    var n = shownNews().filter(function (x) { return x.key === key; })[0]; if (!n) return;
    markSeen([key]);
    switch (n.kind) {
      case 'notice': openNotice(n); return;
      case 'pour': setSite(n.site); openOffice('pours'); return;
      case 'sheet': setSite(n.site); openOffice('sheets'); return;
      case 'contract': setSite(n.site); openOffice('contracts'); return;
      case 'todo': setSite(n.site); openTodo('hub'); return;
      case 'worker': setSite(n.site); openWork('hub'); return;
      default: render();
    }
  },
  // 我的工作
  reload: function () { refresh(); },
  site: function (v) { S.site = v; LS.set('site', v); S.entries = []; render(); refresh(); prefetchLog(v, null, true); },
  add: function () { openEdit(null); },
  logsfromwork: function () { openLogs('work'); },
  open: function (id) {
    var e = S.entries.filter(function (x) { return x.id === id; })[0]; if (!e) return;
    if (e.mine) openEdit(e); else { S.view = e; go('view'); }
  },
  date: function (v) { S.d.date = v; applyWx(); render(); },
  wx: function (v) { S.d.weather = S.d.weather === v ? '' : v; S.d.touchedWx = true; render(); },
  cat: function (v) { S.d.cat = v; render(); },
  hours: function (v) { S.d.hours = v; render(); },
  matadd: function () { S.d.mats.push({ vendor: '', qty: '', unit: '' }); render(); },
  matdel: function (v) { S.d.mats.splice(+v, 1); render(); },
  matv: function (v) { var i = +v.split('|')[0]; S.d.mats[i].vendor = v.slice(v.indexOf('|') + 1); render(); },
  matu: function (v) { var i = +v.split('|')[0]; S.d.mats[i].unit = v.slice(v.indexOf('|') + 1); render(); },
  rmremote: function (v) { var d = S.d; d.remote = d.remote.filter(function (x) { return x !== v; }); d.removed.push(v); render(); },
  rmlocal: function (v) { S.d.local.splice(+v, 1); render(); },
  rmremoter: function (v) { var d = S.d; d.remoteR = d.remoteR.filter(function (x) { return x !== v; }); d.removedR.push(v); render(); },
  rmlocalr: function (v) { S.d.localR.splice(+v, 1); render(); },
  cam: function () { pickPhoto('photo', true); },
  pick: function () { pickPhoto('photo', false); },
  camr: function () { pickPhoto('receipt', true); },
  pickr: function () { pickPhoto('receipt', false); },
  save: function () {
    var d = S.d; if (S.busy) return;
    S.busy = true; S.err = ''; S.progress = '上傳內容…'; render();
    var mats = d.mats.filter(function (m) { return (m.vendor || '').trim() || (m.qty || '').trim(); });
    var entry = { date: d.date, site: S.site, category: d.cat, hours: d.hours, text: d.text.trim(), weather: d.weather, materials: mats, siteText: d.siteText.trim() };
    if (d.id) entry.id = d.id;
    var chain = api('save', { entry: entry }).then(function (r) { d.id = r.id; });
    d.removed.concat(d.removedR).forEach(function (fid) {
      chain = chain.then(function () { return api('delphoto', { id: d.id, fileId: fid }); })
        .then(function () { d.removed = d.removed.filter(function (x) { return x !== fid; }); d.removedR = d.removedR.filter(function (x) { return x !== fid; }); });
    });
    var todo = d.local.map(function (p) { return { p: p, r: false }; }).concat(d.localR.map(function (p) { return { p: p, r: true }; }));
    todo.forEach(function (x, i) {
      chain = chain.then(function () {
        S.progress = (x.r ? '上傳單據 ' : '上傳照片 ') + (i + 1) + '/' + todo.length + '…'; render();
        return api('photo', { id: d.id, name: (x.r ? '單據_' : '') + x.p.name, mime: 'image/jpeg', data: x.p.data, receipt: x.r });
      }).then(function (r) {
        S.photos['w:' + r.fileId] = x.p.url;
        if (x.r) { d.remoteR.push(r.fileId); d.localR = d.localR.filter(function (y) { return y !== x.p; }); }
        else { d.remote.push(r.fileId); d.local = d.local.filter(function (y) { return y !== x.p; }); }
      });
    });
    chain.then(function () { S.busy = false; S.progress = ''; S.feedStale = true; go('work'); refresh(); })
      .catch(function (e) { S.busy = false; S.progress = ''; var m = failMsg(e); if (m) { S.err = m + (d.id && (d.local.length || d.localR.length) ? '（已經傳上去的不會重複，再按一次會接著傳）' : ''); render(); } });
  },
  del: function () {
    var d = S.d; if (!d.id || S.busy) return;
    if (!confirm('要刪除這一筆嗎？內容和照片都會拿掉（管理者那邊會留紀錄）。')) return;
    S.busy = true; render();
    api('delete', { id: d.id }).then(function () { S.busy = false; S.feedStale = true; go('work'); refresh(); })
      .catch(function (e) { S.busy = false; var m = failMsg(e); if (m) { S.err = m; render(); } });
  },
  // 工地頁
  tile: function (v) {
    if (v === 'logs') openLogs('site');
    else if (v === 'todo') openTodo('site');
    else openOffice(v);
  },
  officereload: function () { loadOffice(); },
  pdfopen: function (id) { openPdf(id); },
  ctab: function (v) { S.contractTab = +v; render(); },
  // 待辦
  todoreload: function () { S.todoErr = ''; loadTodos(); },
  todoshowdone: function () { S.todoShowDone = !S.todoShowDone; render(); },
  todoaddpage: function () {
    var text = S.todoText.trim(), site = S.site; if (!text) return;
    S.todoText = ''; S.todoErr = '';
    (S.todoItems = S.todoItems || []).push({ id: 'tmp' + Date.now(), site: site, text: text, done: false, by: S.s.name, at: Date.now() });
    render();
    api('todo', { op: 'add', site: site, text: text }).then(function () { S.feedStale = true; return loadTodos(); })
      .catch(function (e) { var m = failMsg(e); if (m) { S.todoErr = '沒有加進去：' + m; loadTodos(); } });
  },
  todocheck: function (id) {
    var t = findTodo(id); if (!t || /^tmp/.test(id)) return;
    t.done = !t.done; t.doneBy = t.done ? S.s.name : ''; t.doneAt = t.done ? Date.now() : 0; render();
    api('todo', { op: 'check', id: id, done: t.done }).then(function () { S.feedStale = true; loadTodos(); })
      .catch(function (e) { var m = failMsg(e); if (m) { S.todoErr = '沒有改到：' + m; loadTodos(); } });
  },
  todoedit: function (id) { var t = findTodo(id); if (!t || /^tmp/.test(id)) return; S.modal = { type: 'todoedit', t: t, text: t.text, ask: false, busy: false, err: '' }; renderModal(); },
  // 日誌
  logdate: function (v) { if (v) loadLog(v); },
  logdates: function () { if (S.log && S.log.dates.length) { S.modal = { type: 'dates' }; renderModal(); } },
  // 行事曆
  calreload: function () { loadCal(); },
  calmonth: function (v) {
    var C = S.cal; C.month = shiftMonth(C.month, +v);
    C.sel = C.month === todayYmd().slice(0, 7) ? todayYmd() : C.month + '-01';
    C.events = C.cache[C.month] || []; C.err = ''; render(); loadCal();
  },
  calsel: function (v) { S.cal.sel = v; render(); },
  calev: function (v) { var e = eventsOn(S.cal.events, S.cal.sel)[+v]; if (e) openCalEdit(e); },
  caladd: function () { openCalEdit(null); },
  // 跳出的視窗
  mclose: function () { if (S.modal && S.modal.busy) return; closeModal(); render(); },
  maskclose: function (v, el, ev) { if (ev.target === el && !(S.modal && S.modal.busy)) { closeModal(); render(); } },
  mnsite: function (v) { S.modal.site = v; renderModal(); },
  mnday: function (v) { S.modal.day = v; S.modal.other = false; renderModal(); },
  mnother: function () { var m = S.modal; m.other = true; if (!m.day || m.day <= addDays(todayYmd(), 2)) m.day = addDays(todayYmd(), 3); renderModal(); },
  mncam: function () { pickPhoto('notice', true); },
  mnpick: function () { pickPhoto('notice', false); },
  mnphotodel: function () { S.modal.photo = null; renderModal(); },
  mnsend: function () {
    var m = S.modal; if (!noticeOk(m)) return;
    m.busy = true; m.err = ''; renderModal();
    var body = { op: 'add', site: m.site, text: m.text.trim(), date: m.day }; if (m.photo) body.photo = m.photo.data;
    api('notice', body).then(function () { S.modal = null; renderModal(); loadFeed(false); })
      .catch(function (e) { m.busy = false; var x = failMsg(e); if (x) { m.err = '沒有送出：' + x; renderModal(); } });
  },
  mnask: function () { S.modal.ask = !S.modal.ask; renderModal(); },
  mndel: function () {
    var m = S.modal; if (m.busy) return; m.busy = true; renderModal();
    api('notice', { op: 'del', id: m.n.id }).then(function () { S.modal = null; renderModal(); loadFeed(false); })
      .catch(function (e) { m.busy = false; var x = failMsg(e); if (x) { m.err = '刪不掉：' + x; renderModal(); } });
  },
  mtsite: function (v) { S.modal.site = v; renderModal(); },
  mtadd: function () {
    var m = S.modal; if (!modalOk(m) || m.busy) return;
    m.busy = true; renderModal();
    api('todo', { op: 'add', site: m.site, text: m.text.trim() }).then(function () { S.modal = null; renderModal(); loadFeed(false); })
      .catch(function (e) { m.busy = false; var x = failMsg(e); if (x) { m.err = '沒有加進去：' + x; renderModal(); } });
  },
  mtsave: function () {
    var m = S.modal; if (!modalOk(m) || m.busy) return;
    if (m.text.trim() === m.t.text) { closeModal(); return; }
    m.busy = true; renderModal();
    api('todo', { op: 'edit', id: m.t.id, text: m.text.trim() }).then(function () { S.modal = null; renderModal(); S.feedStale = true; loadTodos(); })
      .catch(function (e) { m.busy = false; var x = failMsg(e); if (x) { m.err = '存不起來：' + x; renderModal(); } });
  },
  mtdel: function () {
    var m = S.modal; if (m.busy) return;
    if (!m.ask) { m.ask = true; renderModal(); return; }
    m.busy = true; renderModal();
    api('todo', { op: 'del', id: m.t.id }).then(function () { S.modal = null; renderModal(); S.feedStale = true; loadTodos(); })
      .catch(function (e) { m.busy = false; var x = failMsg(e); if (x) { m.err = '刪不掉：' + x; renderModal(); } });
  },
  mlogdate: function (v) { closeModal(); if (v !== S.log.date) loadLog(v); },
  mcaldate: function (v) { var m = S.modal; if (m.ev.series) return; m.date = addDays(m.date, +v); renderModal(); },
  mallday: function (v) { var m = S.modal; if (m.ev.series) return; m.allDay = v === '1'; if (!m.allDay && !m.start) m.start = '09:00'; renderModal(); },
  mcalsite: function (v) { var m = S.modal; if (m.ev.series) return; m.site = v; renderModal(); },
  mcaldel: function () { S.modal.ask = true; S.modal.err = ''; renderModal(); },
  mcalnodel: function () { S.modal.ask = false; S.modal.err = ''; renderModal(); },
  mcalsave: function () {
    var m = S.modal; if (!modalOk(m)) return;
    m.busy = true; m.err = ''; renderModal();
    var body = { op: m.isNew ? 'add' : 'edit', id: m.ev.id, title: m.title.trim(), allDay: m.allDay, date: m.date, endDate: addDays(m.date, m.span),
      start: m.allDay ? '' : m.start, end: (m.allDay || !HM.test(m.end)) ? '' : m.end, site: m.site, note: m.note.trim() };
    api('cal', body).then(function (r) {
      var d = (r.event && r.event.date) || m.date;
      S.modal = null; renderModal();
      S.cal.sel = d; S.cal.month = d.slice(0, 7); S.cal.cache = {}; S.feedStale = true; render(); loadCal();
    }).catch(function (e) { m.busy = false; var x = failMsg(e); if (x) { m.err = '存不起來：' + x; renderModal(); } });
  },
  mcaldel2: function () {
    var m = S.modal; if (m.busy) return;
    m.busy = true; m.err = ''; renderModal();
    api('cal', { op: 'del', id: m.ev.id }).then(function () { S.modal = null; renderModal(); S.cal.cache = {}; S.feedStale = true; loadCal(); })
      .catch(function (e) { m.busy = false; var x = failMsg(e); if (x) { m.err = '刪不掉：' + x; renderModal(); } });
  }
};

document.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el || el.disabled) return;
  var a = el.getAttribute('data-act');
  if (ACT[a]) { if (a !== 'maskclose') ev.preventDefault(); ACT[a](el.getAttribute('data-v'), el, ev); }
});
document.addEventListener('input', function (ev) {
  var k = ev.target.getAttribute && ev.target.getAttribute('data-f'); if (!k) return;
  var v = ev.target.value;
  if (k === 'codeInput') { S.codeInput = v; return; }
  if (k === 'todoText') { S.todoText = v; var tb = $('todoaddbtn'); if (tb) tb.disabled = !v.trim(); return; }
  if (k.indexOf('m.') === 0) {
    var m = S.modal; if (!m) return;
    m[k.slice(2)] = v;
    if (k === 'm.day') { renderModal(); return; }   // 選了日子：下面的「📅 11/12（四）」跟著換
    var b = $('msave'); if (b) b.disabled = !modalOk(m) || !!m.busy;
    var mm = $('mmsg'); if (mm && m.type === 'cal') mm.textContent = m.err || calProblem(m);
    return;
  }
  var d = S.d; if (!d) return;
  if (k === 'text' || k === 'siteText') { d[k] = v; }
  else if (k.indexOf('mat.') === 0) { var p = k.split('.'); d.mats[+p[1]][p[2]] = v; }
  // 上傳按鈕要不要亮：只改按鈕，不整個重畫（不然打字會跳掉）
  var sb = document.querySelector('[data-act="save"]');
  if (sb) sb.disabled = !editOk();
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter') return;
  if (S.route === 'login' && ev.target.id === 'code') ACT.login();
  if (ev.target.id === 'todotext') { ev.preventDefault(); ACT.todoaddpage(); }
});
function onPicked(ev) {
  var files = ev.target.files;
  if (S.pickFor === 'notice') {
    var f = files && files[0], m = S.modal; if (!f || !m) return;
    shrink(f, 1000, 0.65).then(function (p) { if (S.modal === m) { m.photo = p; renderModal(); } }).catch(function () { });
  } else addFiles(files, S.pickFor === 'receipt');
}
$('cam').addEventListener('change', onPicked);
$('pick').addEventListener('change', onPicked);

// 首頁開著的時候每 1 分鐘自己更新（不用按「⟳ 更新」；問候語也跟著時間換）
setInterval(function () { if (S.route === 'hub' && S.s && !S.modal && document.visibilityState !== 'hidden') loadFeed(false); }, 60000);
// 從背景切回來（iPhone 把這個 App 叫回來）：首頁馬上更新
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && S.route === 'hub' && S.s && !S.modal) loadFeed(false);
});

// ---------- 開始 ----------
// 記住的代碼：顯示鎖住的 ●●●●●●，按「登入」才進去（使用者 2026-11-08）
S.saved = LS.get('code');
S.site = LS.get('site');
render();
</script>

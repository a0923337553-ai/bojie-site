<html lang="zh-Hant">
<head>

<title>柏捷工地 3D 結構</title>
<!--
  3D 結構閱覽（使用者 2026-11-10：「先做結構體」、「點一個柱或梁，看它的配筋」就夠了；App、iPhone 網頁、電腦版都要，施工人員看不到）
  資料：BricsCAD「混凝土 → 上傳 3D 到工地App」傳到雲端 工地App/3D/<工地>/結構3D.json，收件服務 model3d 給老闆、主任、公司、開發者。
  打開方式：
    網頁／電腦版：index.html 工地頁的「3D 結構」用 iframe 打開 3d.html?site=…&embed=1，代碼讀同一個網站存的 bojie.code
    手機 App：WebView 打開 3d.html?site=…&app=android，收件服務由 App 代傳（window.Android.call），代碼不進網頁
    測試：3d.html?demo=1（範例房子）、3d.html?file=xxx.json（本機檔）
-->
<style>
:root{--teal:#0F766E;--teal2:#E6F4F1;--ink:#1F2933;--sub:#5B6770;--line:#E2E8EC;--bg:#F4F6F7;--warn:#E8590C;--side:360px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;overflow:hidden}
button{font:inherit}
#top{position:fixed;left:0;right:0;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px}
.bar h1{flex:1;margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-size:12px;color:var(--sub);font-weight:400}
.btn{border:0;background:var(--teal2);color:var(--teal);border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--teal);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.chips{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font-size:14px;cursor:pointer;white-space:nowrap;user-select:none}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.off{color:#9AA5AD;text-decoration:line-through}
.chip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#view{position:fixed;left:0;right:0;bottom:0;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
/* 圈起來（使用者 2026-11-10「可以圈起來，哪裡需要改進」） */
#pins{position:fixed;z-index:4;pointer-events:none;overflow:hidden}
#pins .pin{position:absolute;pointer-events:auto;cursor:pointer}
#pins .ring{position:absolute;border:3px solid #E03131;border-radius:50%;transform:translate(-50%,-50%);box-sizing:border-box;pointer-events:none}
#pins .num{position:absolute;transform:translate(-50%,-50%);min-width:22px;height:22px;border-radius:11px;background:#E03131;color:#fff;font-size:12px;font-weight:700;text-align:center;line-height:22px;padding:0 4px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#pins .done .ring{border-color:#0F766E}#pins .done .num{background:#0F766E}
#pins .on .ring{border-width:4px;border-color:#F2C230}#pins .draft .ring{border-style:dashed}
#draw{position:fixed;z-index:7;touch-action:none;display:none;cursor:crosshair}
/* 搭接段的長度（使用者 2026-11-10「在 3D 把搭接段標顏色、寫上搭接長度」）：綠色框旁邊的字 */
#laps{position:fixed;z-index:3;pointer-events:none;overflow:hidden}
#laps .lb{position:absolute;transform:translate(-50%,-130%);background:#15803D;color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:1px 6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
#laps .lb.cp{background:#D6336C}
#laps .lb.top{background:#1D4ED8}
/* 梁配筋圖（照 DXF 的那張，使用者 2026-11-10「除了顯示3d也要有配筋圖」）：卡片裡一小張、可以放大 */
.dwg{margin-top:8px;border-radius:10px;overflow:hidden;background:#1E2228;border:1px solid #2B3138}
.dwg svg{display:block;width:100%;height:auto;max-height:280px}
#dwgView{position:fixed;inset:0;z-index:30;background:#14171B;display:none;flex-direction:column}
#dwgView .bar{display:flex;align-items:center;gap:8px;padding:8px 10px;color:#fff;font-weight:700;background:#1E2228}
#dwgView .bar .t{flex:1;font-size:15px}
#dwgView .bar button{border:0;border-radius:10px;padding:7px 14px;font:inherit;font-size:16px;font-weight:700;background:#334155;color:#fff;cursor:pointer}
#dwgView .sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#dwgView .sc svg{display:block;height:auto}
/* 「專案 → 配筋圖」那幾頁（使用者 2026-11-12「我要像圖二抓裡面對應的配筋」）：柱配筋表各樓層、斷面、牆／版配筋表、基礎配筋 */
.pg{margin-top:10px}
.pg .h{font-weight:700}
.pgt{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:6px;border:1px solid var(--line);border-radius:8px}
.card .pgt table{border-collapse:collapse;margin:0;font-size:13px;min-width:100%}
.card .pgt th,.card .pgt td{padding:4px 8px;border-bottom:1px solid #EEF1F4;white-space:nowrap;text-align:left;color:var(--ink);vertical-align:middle}
.card .pgt th{background:#F4F6F8;font-weight:600;color:#52606D}
.card .pgt tr.g th{background:#fff;color:var(--ink);font-weight:700;padding-top:8px}
.card .pgt tr.on td{background:#FFE8CC;font-weight:700}
.card .pgt tr.on td:first-child{box-shadow:inset 4px 0 0 #F97316}
.secBox{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.secBox .st2{font-weight:700;font-size:14px}
.secBox svg{display:block;width:100%;max-width:260px;height:auto;margin:6px auto;border-radius:6px}
.secInfo{font-size:13px;line-height:1.6}
.secInfo .warn{color:#D32F2F;font-weight:700}
.shBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
@media (min-width:900px){ .card .pgt table{font-size:14px} }
.lapList{margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.lapList li{padding:2px 0}.lapList b{color:#15803D}
#markBtn{position:fixed;z-index:6;border:0;border-radius:18px;padding:6px 12px;font-weight:700;background:#E03131;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;display:none}
#markBtn.on{background:#fff;color:#E03131;border:2px solid #E03131}
#markForm{position:fixed;z-index:8;left:8px;right:8px;top:var(--topH,110px);margin-top:6px;background:#fff;border:2px solid #E03131;border-radius:14px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:none}
#markForm textarea{margin:6px 0 2px;min-height:58px;font-size:16px}
@media (min-width:900px){#markForm{left:auto;right:calc(var(--side) + 16px);width:440px}}
/* 圈的時候上面那條：先「✋ 轉動」轉到要的位置、放大，再按「⭕ 畫圈」（使用者 2026-11-10「進入圈選應該要讓使用者可以放大縮小轉向至要的位置再框選」） */
#markBar{position:fixed;z-index:8;transform:translateX(-50%);background:#fff;border:2px solid #E03131;border-radius:14px;padding:6px 8px;box-shadow:0 4px 12px rgba(0,0,0,.18);display:none;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;max-width:calc(100vw - 16px);box-sizing:border-box}
#markBar .t{flex:1 1 100%;text-align:center;font-size:13px;color:#C92A2A;font-weight:700}
#markBar button{border:1px solid #CBD5DC;background:#fff;border-radius:14px;padding:6px 14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;color:#1F2933}
#markBar button.on{background:#E03131;border-color:#E03131;color:#fff}
.mk{border:1px solid var(--line);border-radius:12px;padding:7px 10px;margin:0 0 8px;cursor:pointer}
.mk .no{display:inline-block;min-width:20px;height:20px;border-radius:10px;background:#E03131;color:#fff;font-size:12px;text-align:center;line-height:20px;margin-right:6px;padding:0 3px}
.mk.done .no{background:#0F766E}.mk.on{border-color:#F2C230;background:#FFFBEA}
.mk .who{color:var(--sub);font-size:12px}
.st{font-size:11px;border-radius:5px;padding:0 5px;margin-left:4px}.st.o{background:#FFE3E3;color:#C92A2A}.st.d{background:#E6F4F1;color:#0F766E}
textarea.in{width:100%;min-height:64px;border:1px solid #CBD5DC;border-radius:10px;padding:8px;font:inherit;resize:vertical}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:4;background:rgba(31,41,51,.78);color:#fff;border-radius:12px;padding:7px 14px;font-size:13px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
#side{position:fixed;z-index:6;background:#fff;box-shadow:0 -4px 18px rgba(0,0,0,.12)}
#side .hd{display:flex;align-items:center;gap:8px;padding:10px 14px 6px;font-weight:700}
#side .hd span{flex:1}
#side .bd{overflow-y:auto;padding:0 14px 12px;min-height:0;flex:1 1 auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.pour{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 0 8px;cursor:pointer}
.pour.on{border-color:var(--warn);background:#FFF4EC}
.pour b{font-size:15px}
.pour .m{color:var(--sub);font-size:13px}
.pour .day{color:var(--warn);font-weight:700}
.tip{background:#EEF3FF;border-radius:12px;padding:8px 10px;margin:0 0 10px;font-size:14px;color:#2F4A9E}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.card .t{font-size:17px;font-weight:700}
.card .k{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;margin-right:6px;color:#fff;vertical-align:2px}
.card table{border-collapse:collapse;margin-top:6px;font-size:14px}
.card td{padding:2px 10px 2px 0;vertical-align:top}
.card td:first-child{color:var(--sub);white-space:nowrap}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--sub);font-size:13px}
#msg{position:fixed;left:0;right:0;top:40%;z-index:7;color:var(--sub);text-align:center;padding:24px;font-size:16px}
#msg .btn{margin-top:12px}
@media (max-width:899px){
  #side{left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:46vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  #side.min .bd{display:none}
}
/* 電腦：右邊一欄，排得寬鬆（使用者 2026-11-10「電腦螢幕排法要舒適，不要那麼擠」） */
@media (min-width:900px){
  body{font-size:16px}
  .bar{padding:10px 20px}.chips{padding:0 20px 10px}
  .bar h1{font-size:19px}
  #side{top:var(--topH,110px);right:0;bottom:0;width:var(--side);border-left:1px solid var(--line);box-shadow:none;display:flex;flex-direction:column}
  #side .hd{padding:16px 18px 8px;font-size:17px}#side .bd{padding:0 18px 16px}
  #side .hd .tog{display:none}
  .card table{font-size:15px}
}
@media (min-width:1600px){ :root{--side:420px} body{font-size:17px} }
#viewBtn{background:#FFF4E6;color:#C2410C}
.bar h1{min-width:0}   /* 手機：標題太長就「…」，按鈕才不會被擠出畫面 */
@media (max-width:480px){ .bar{gap:6px;padding:8px 8px} .bar .btn{padding:7px 9px} }
</style>

<body>
<div id="top">
  <div class="bar">
    <button class="btn ghost" id="back">‹ 返回</button>
    <h1 id="title">3D 結構 <span class="sub" id="made"></span></h1>
    <button class="btn" id="viewBtn" style="display:none"></button>
    <button class="btn" id="reset">整棟</button>
  </div>
  <div class="chips" id="floors"></div>
  <div class="chips" id="kinds"></div>
</div>
<div id="view"></div>
<div id="msg">載入中…</div>
<div id="hint"></div>
<div id="laps"></div>
<div id="pins"></div>
<svg id="draw"><path id="drawPath" fill="none" stroke="#E03131" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<button id="markBtn">✏️ 圈起來</button>
<div id="markBar"><div class="t" id="mbText"></div><button id="mbMove">✋ 轉動、放大</button><button id="mbDraw">⭕ 畫圈</button></div>
<!-- 寫要改進什麼：放在畫面最上面（下面那塊會被手機鍵盤蓋住，使用者 2026-11-10「圈起來的功能沒有辦法打字」） -->
<div id="markForm">
  <div style="font-weight:700"><span id="mfTitle">✏️ 寫要改進什麼</span> <span class="muted" id="mfMember"></span></div>
  <textarea class="in" id="markText" maxlength="300" placeholder="例如：2F 這支梁的上層筋看起來不夠長，請確認"></textarea>
  <div class="row"><button class="btn solid" id="markSend">送出</button><button class="btn" id="markRedo">⭕ 重圈</button><button class="btn ghost" id="markCancel">取消圈</button><span class="muted" id="markErr"></span></div>
</div>
<div id="dwgView"><div class="bar"><span class="t" id="dwgTitle">配筋圖</span><button id="dwgOut">－</button><button id="dwgIn">＋</button><button id="dwgClose">✕ 關閉</button></div><div class="sc" id="dwgBody"></div></div>

  <div class="hd"><span id="sideTitle">🚚 灌漿區</span><button class="btn ghost tog" id="tog">收起</button></div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbyAF82NyYZZ81ISJ_r7_jPRP0rWNA4kLraB9uMkd2FuZwbnkOJ9SzuM9HaA-oymdXpQ/exec';
var THREE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js';
var GLTF_URL = 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
</script>
<script type="module">
const P = new URLSearchParams(location.search);
const SITE = P.get('site') || '';
const EMBED = P.get('embed') === '1';
// 配筋、鋼筋先藏起來（使用者 2026-11-13「3d目前想把配筋根鋼筋拿掉」→「先藏起來」：程式和資料留著，網址加 &rebar=1 才看得到）
const REBAR_ON = P.get('rebar') === '1';
const msgEl = document.getElementById('msg');
function say(html) { msgEl.innerHTML = html; msgEl.style.display = html ? '' : 'none'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function ls(k, v) { try { if (v === undefined) return localStorage.getItem('bojie.' + k) || ''; if (v) localStorage.setItem('bojie.' + k, v); else localStorage.removeItem('bojie.' + k); } catch (e) { return ''; } }

// ---------- 返回 ----------
function goBack() {
  if (window.Android && Android.close) return Android.close();
  if (EMBED && parent !== window && parent.close3d) return parent.close3d();
  if (history.length > 1) history.back(); else location.href = './' + (P.get('app') === 'pc' ? '?app=pc' : '');
}
document.getElementById('back').onclick = goBack;
addEventListener('keydown', e => { if (e.key === 'Escape') goBack(); });

// ---------- 收件服務：App 裡由 App 代傳（代碼不進網頁），網頁用存在這個網站的代碼 ----------
let cbN = 0; const cbs = {};
window.__bojie3dCb = (id, text) => { const f = cbs[id]; delete cbs[id]; if (f) f(text); };
function api(action, body) {
  const req = Object.assign({ action }, body || {});
  if (window.Android && Android.call) return new Promise((ok, bad) => {
    const id = 'c' + (++cbN);
    cbs[id] = t => { let r = null; try { r = JSON.parse(t); } catch (e) { } if (r && r.ok) ok(r); else bad(r || { error: '收件服務回覆看不懂' }); };
    Android.call(JSON.stringify(req), id);
  });
  req.code = ls('code'); req.client = 'page'; req.device = ls('device');
  if (!req.code) return Promise.reject({ error: 'NOCODE' });
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req) })
    .then(r => r.json(), () => { throw { error: '連不上收件服務（網路有問題，等一下再試）' }; })
    .then(r => { if (r && r.ok) return r; throw (r || {}); });
}
function errText(e) {
  if (!e) return '讀不到';
  if (e.error === 'NOCODE') return '請先在柏捷工地登入再打開 3D';
  if (e.message) return e.message;
  const m = String(e.error || '讀不到'); return /^[A-Z]+：/.test(m) ? m.split('：').slice(1).join('：') : m;
}

// ---------- 讀模型：記在這台（沒改就不重抓）；灌漿清單每次都問 ----------
let M = null, pours = [], marks = [], me = null;
const LOCAL = !!(P.get('demo') || P.get('file'));   // 本機測試：圈的只存在畫面上
async function loadModel() {
  if (P.get('demo')) return demoModel();
  if (P.get('file')) {   // 本機測試：?file=結構3D.json&pourparts=基礎,2F
    pours = (P.get('pourparts') || '').split(',').filter(Boolean).map((p, i) => ({ id: 't' + i, date: '2026-11-' + (12 + i), part: p, m3: '', trucks: '' }));
    me = { name: '測試', role: '管理者' };
    return fetch(P.get('file')).then(r => r.json());
  }
  let have = null;
  try { have = JSON.parse(ls('m3d.' + SITE) || 'null'); } catch (e) { have = null; }
  const r = await api('model3d', { site: SITE, have: have ? have.modified : '' });
  pours = (r.pours || []).map(p => { const pr = p.props || {}; return { id: p.id, date: pr.pourDate || '', part: pr.part || String(p.name || '').replace(/\.pdf$/i, ''), m3: pr.m3 || '', trucks: pr.trucks || '' }; });
  marks = r.marks || []; me = r.me || null;
  SKMETA = r.sk || null;   // 收件服務第 27 版：這個工地有 SketchUp 模型
  if (r.same && have) return JSON.parse(have.text);
  if (!r.model) { if (SKMETA) return null; throw { error: 'NONE' }; }
  ls('m3d.' + SITE, JSON.stringify({ modified: r.modified || '', text: r.model }));
  return JSON.parse(r.model);
}

// ---------- SketchUp 模型（使用者 2026-11-13「這個3d結構功能我想改成匯入sketchup的模型」，選 A：打開先看 SketchUp 模型） ----------
// 電腦把 .skp 轉成 .glb（材質、群組名、標籤＝樓層）傳到 工地App/3D/<工地>/SketchUp模型.glb；收件服務 model3d {skPart} 一段一段給（App 也只能問 model3d）。
// 下載好記在這台（IndexedDB），模型沒換就不重抓。本機測試：&glb=xxx.glb
let SK = null, SKMETA = P.get('glb') ? { local: P.get('glb') } : null, skErr = '';
const skItems = [];   // {mesh, tag, name, mat}
function idb() {
  return new Promise((ok, bad) => {
    try { const q = indexedDB.open('bojie3d', 1); q.onupgradeneeded = () => q.result.createObjectStore('sk'); q.onsuccess = () => ok(q.result); q.onerror = () => bad(q.error); }
    catch (e) { bad(e); }
  });
}
async function idbGet(k) { try { const db = await idb(); return await new Promise(ok => { const q = db.transaction('sk').objectStore('sk').get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; } }
async function idbPut(k, v) { try { const db = await idb(); db.transaction('sk', 'readwrite').objectStore('sk').put(v, k); } catch (e) { } }

  pours = [{ id: 'p1', date: '2026-11-12', part: '2F', m3: '96.0', trucks: '11' }, { id: 'p2', date: '2026-10-28', part: '基礎', m3: '120.0', trucks: '14' }];
  return { v: 1, site: '範例工地', made: '2026-11-10 10:30', floors, m,
    rb: { '柱|1F|C1': { t: '柱', size: '70x70', main: '16-#8', tieEnd: '#4@10', tieMid: '#4@15', cx: '3', cy: '3' },
      '梁|2F|G1': { t: '梁', size: '50x70', kind: '大梁', topSize: '#8', botSize: '#8', top: ['6', '3', '6'], bot: ['3', '5', '3'], topLen: ['', ''], botLen: ['', ''], stir: ['16-#4@10', '#4@15', '16-#4@10'], side: '2-#4' },
      '梁|1F|FG1': { t: '梁', size: '60x150', kind: '地梁', topSize: '#8', botSize: '#8', top: ['5', '5', '5'], bot: ['5', '5', '5'], topLen: ['', ''], botLen: ['', ''], stir: ['', '#4@15', ''], side: '4-#4' } } };
}

try {
  say('載入中…');
  const [three, model] = await Promise.all([import(THREE_URL), loadModel()]);
  THREE = three; M = model || { m: [], floors: [], groups: [], site: SITE };   // 只有 SketchUp 模型、還沒有 3D 結構
  if (SKMETA) {
    try { SK = await loadSk(); }
    catch (e) { skErr = errText(e); console.error(e); if (!hasStruct()) throw e; }   // 有 3D 結構就先看 3D 結構
  }
  start();
} catch (e) {
  const t = e && e.error === 'NONE' ? '這個工地還沒有 3D。<br><span class="muted">SketchUp 模型：電腦上把 .skp 拖到「SketchUp 傳到工地App」；3D 結構：BricsCAD「混凝土」按「全部樓層」，再按「上傳 3D 到工地App」。</span>' : esc(errText(e));
  say('<div>' + t + '</div><button class="btn ghost" onclick="location.reload()">再試一次</button>');
  console.error(e);
}
